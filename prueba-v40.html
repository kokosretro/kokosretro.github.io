// V35: edición diferencial: conservar registros sin cambios, y nunca borrar toda la galería para reinsertarla.
async function kokosV35SyncPhotos(table,fk,id,previous,next){
 const oldRows=await sbTable(table,fk+'=eq.'+encodeURIComponent(id));
 const unique=[...new Set(next)];
 if(unique.length!==next.length)throw Error('Hay fotografías repetidas. Elimina las URL duplicadas.');
 const existing=new Map(oldRows.map(r=>[String(r.image_url),r]));
 // Crear primero las nuevas referencias; no tocar las existentes si la inserción falla.
 for(let i=0;i<unique.length;i++){
  const url=unique[i];if(!existing.has(url)){
   const payload={[fk]:id,image_url:url,sort_order:i};
   await sbWrite(table,payload);
  }
 }
 // Actualizar solo posiciones modificadas.
 const current=await sbTable(table,fk+'=eq.'+encodeURIComponent(id));
 for(let i=0;i<unique.length;i++){
  const row=current.find(r=>r.image_url===unique[i]);
  if(row&&Number(row.sort_order)!==i)await sbWrite(table,{sort_order:i},'PATCH','id=eq.'+encodeURIComponent(row.id));
 }
 // Eliminar solo referencias que el usuario quitó.
 for(const row of oldRows){if(!unique.includes(row.image_url))await sbRequest('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(row.id),{method:'DELETE',auth:true})}
 return oldRows.map(r=>r.image_url).filter(url=>!unique.includes(url));
}
async function kokosV35CleanupStorage(urls){

 const prefix=SB_URL+'/storage/v1/object/public/kokos-images/';
 const removable=[...new Set(urls)].filter(u=>typeof u==='string'&&u.startsWith(prefix)&&!stillUsed.has(u));
 for(const url of removable){
  const path=url.slice(prefix.length);
  if(!/^catalogo\/[a-f0-9-]+\.(jpg|png|webp|avif)$/i.test(path))continue;
  const response=await fetch(SB_URL+'/storage/v1/object/kokos-images/'+path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+sbSession.access_token}});
  if(!response.ok)console.warn('No se pudo limpiar archivo sin referencias:',path,response.status);
 }
}

async function kokosUploadPhotos(fileInputId,targetId){
 if(!isLogged())return alert('Primero inicia sesión como administrador.');
 const fileInput=$(fileInputId),target=$(targetId),files=[...(fileInput?.files||[])];
 if(!target||!files.length)return alert('Selecciona al menos una fotografía.');
 const allowed=['image/jpeg','image/png','image/webp','image/avif'];
 if(files.some(f=>!allowed.includes(f.type)||f.size>8*1024*1024))return alert('Usa JPG, PNG, WebP o AVIF de hasta 8 MB por fotografía.');
 const btn=fileInput.nextElementSibling;
 if(btn)btn.disabled=true;
 try{
  const urls=[];
  for(const file of files){
   const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'})[file.type];
   const path='catalogo/'+crypto.randomUUID()+'.'+ext;
   const response=await fetch(SB_URL+'/storage/v1/object/kokos-images/'+path,{
    method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+sbSession.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file
   });
   if(!response.ok)throw Error('No se pudo subir '+file.name+' ('+response.status+'): '+(await response.text()).slice(0,180));
   urls.push(SB_URL+'/storage/v1/object/public/kokos-images/'+path);
  }
  target.value=targetId==='edimages'?[target.value.trim(),...urls].filter(Boolean).join('\n'):urls[0];
  alert(urls.length+' imagen(es) subida(s). Ahora pulsa GUARDAR para aplicar los cambios.');
 }catch(error){alert(error.message)}finally{if(btn)btn.disabled=false;}
}

let collabTimer=null;
let collabScrollIdleTimer=null;
let collabAutoScrolling=false;
let collabInteractionActive=false;
let collabLastInteraction=0;
let collabNextDelay=2000;
function collabTrack(){return document.getElementById('collab-track')}
function collabCards(){return [...(collabTrack()?.querySelectorAll('.collab')||[])]}
function clearCollabTimers(){
 clearTimeout(collabTimer);
 clearTimeout(collabScrollIdleTimer);
 collabTimer=null;
 collabScrollIdleTimer=null;
}
function scheduleCollabAuto(){
 clearTimeout(collabTimer);
 collabTimer=null;
 const track=collabTrack();
 if(!track||collabCards().length<2)return;
 if(collabInteractionActive)return;
 const delay=Math.max(0,collabNextDelay-(Date.now()-collabLastInteraction));
 collabTimer=setTimeout(()=>{
  if(document.hidden){scheduleCollabAuto();return}
  if(collabInteractionActive||collabAutoScrolling)return;
  slideCollab(1,false);
 },delay);
}
function pauseCollab(){
 collabNextDelay=2500;
 collabInteractionActive=true;
 collabLastInteraction=Date.now();
 clearTimeout(collabTimer);
 collabTimer=null;
}
function finishCollabInteraction(){
 collabLastInteraction=Date.now();
 // Wait for momentum scrolling to settle before starting the 2.5-second manual pause.
 clearTimeout(collabScrollIdleTimer);
 collabScrollIdleTimer=setTimeout(()=>{
  collabInteractionActive=false;
  collabLastInteraction=Date.now();
  scheduleCollabAuto();
 },220);
}
function slideCollab(dir,manual=false){
 const track=collabTrack(),cards=collabCards();
 if(!track||cards.length<2)return;
 if(manual){pauseCollab();collabInteractionActive=false}
 else collabNextDelay=2000;
 const left=track.scrollLeft;
 let i=0;
 for(let j=1;j<cards.length;j++){
  if(Math.abs((cards[j].offsetLeft-cards[0].offsetLeft)-left)<Math.abs((cards[i].offsetLeft-cards[0].offsetLeft)-left))i=j;
 }
 const next=(i+dir+cards.length)%cards.length;
 collabAutoScrolling=true;
 clearTimeout(collabTimer);
 const target=cards[next].offsetLeft-cards[0].offsetLeft;
 track.scrollTo({left:target,behavior:next===0||i===0&&dir<0?'instant':'smooth'});
 // Do not start the countdown until the programmed scroll is finished.
 clearTimeout(collabScrollIdleTimer);
 collabScrollIdleTimer=setTimeout(()=>{
  collabAutoScrolling=false;
  collabLastInteraction=Date.now();
  scheduleCollabAuto();
 },next===0||i===0&&dir<0?80:650);
}
function startCollabCarousel(){
 clearCollabTimers();
 collabAutoScrolling=false;
 collabInteractionActive=false;
 collabLastInteraction=Date.now();
 collabNextDelay=2000;
 const track=collabTrack();
 if(!track||collabCards().length<2)return;
 const onBegin=()=>pauseCollab();
 const onEnd=()=>finishCollabInteraction();
 track.addEventListener('pointerdown',onBegin,{passive:true});
 track.addEventListener('pointerup',onEnd,{passive:true});
 track.addEventListener('pointercancel',onEnd,{passive:true});
 track.addEventListener('touchstart',onBegin,{passive:true});
 track.addEventListener('touchend',onEnd,{passive:true});
 track.addEventListener('touchcancel',onEnd,{passive:true});
 track.addEventListener('wheel',()=>{pauseCollab();finishCollabInteraction()},{passive:true});
 track.addEventListener('scroll',()=>{
  if(collabAutoScrolling)return;
  pauseCollab();
  finishCollabInteraction();
 },{passive:true});
 scheduleCollabAuto();
}

// V30: inventario por clave única. Nunca borrar y reinsertar tallas existentes.
// El upsert usa exactamente la restricción product_inventory(product_id,size).
async function kokosV30SaveInventory(id,rows){
 if(!rows.length)return;
 const unique=new Set(rows.map(r=>String(r.size)));
 if(unique.size!==rows.length)throw Error('Hay tallas repetidas en el formulario.');
 await sbRequest('/rest/v1/product_inventory?on_conflict=product_id,size',{
  method:'POST',auth:true,
  headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:rows
 });
 const saved=await sbTable('product_inventory','product_id=eq.'+encodeURIComponent(id));
 for(const row of rows){
  const found=saved.find(x=>String(x.size)===String(row.size));
  if(!found||Number(found.quantity)!==Number(row.quantity))throw Error('Supabase no confirmó el inventario de talla '+row.size+'. Revisa los permisos de product_inventory.');
 }
}

// V28 — Guardado verificado del orden: no confirmar cambios que Supabase no almacenó.
async function kokosOrganizerSave(){
 if(!isLogged())return alert('Inicia sesión para guardar el orden.');
 if(!kokosOrganizeDirty)return;
 const kind=adminTab,field=kind==='products'?'productDisplayOrder':'catalogDisplayOrder';
 const all=kind==='products'?data.products:data.catalogs;
 const draft=kokosOrganizeDraft.map(String);
 const draftSet=new Set(draft);
 if(draftSet.size!==draft.length||draft.some(id=>!all.some(p=>String(p.id)===id)))return alert('El orden contiene elementos no válidos. Actualiza la página y vuelve a intentarlo.');
 // Conserva las posiciones de las otras categorías y reordena únicamente la categoría activa.
 let index=0;
 const reordered=all.map(p=>draftSet.has(String(p.id))?all.find(x=>String(x.id)===draft[index++]):p);
 const ids=reordered.map(p=>String(p.id));
 const button=document.querySelector('.kokos-organizer-toolbar button.blue');
 if(button){button.disabled=true;button.textContent='GUARDANDO...'}
 try{
  const rows=await sbTable('site_settings');
  const st=rows[0];
  if(!st?.id)throw Error('No se encontró el registro de configuración de Supabase.');
  const content={...(st.content||{}),[field]:ids};
  // return=representation permite detectar actualizaciones rechazadas silenciosamente por RLS.
  const updated=await sbRequest('/rest/v1/site_settings?id=eq.'+encodeURIComponent(st.id)+'&select=id,content',{
   method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:{content}
  });
  if(!Array.isArray(updated)||updated.length!==1)throw Error('Supabase no confirmó la actualización. Revisa los permisos de edición de site_settings.');
  const saved=updated[0]?.content?.[field];
  if(!Array.isArray(saved)||saved.map(String).join('|')!==ids.join('|'))throw Error('El orden devuelto por Supabase no coincide con el solicitado.');
  // Lectura nueva para confirmar persistencia antes de mostrar éxito.
  const verify=await sbTable('site_settings','id=eq.'+encodeURIComponent(st.id));
  const persisted=verify[0]?.content?.[field];
  if(!Array.isArray(persisted)||persisted.map(String).join('|')!==ids.join('|'))throw Error('No se pudo verificar el orden guardado.');
  kokosPublicOrder[kind]=ids;
  if(kind==='products')data.products=reordered;else data.catalogs=reordered;
  kokosOrganizeDirty=false;
  kokosOrganizerReset();
  render(false);
  alert('Orden guardado y verificado en Supabase.');
 }catch(e){
  if(button){button.disabled=false;button.textContent='GUARDAR ORDEN'}
  alert('No se pudo guardar el orden: '+e.message);
 }
}

// V29 — Sincronización del panel tras eliminar, cancelar sin salir y guardado consistente.
function kokosV29SyncDraft(){
 const live=kokosOrganizerItems().map(p=>String(p.id)),valid=new Set(live);
 const prior=kokosOrganizeDraft.filter(id=>valid.has(String(id))).map(String);
 const seen=new Set(prior);
 kokosOrganizeDraft=[...prior,...live.filter(id=>!seen.has(id))];
 kokosOrganizeSelected=new Set([...kokosOrganizeSelected].filter(id=>valid.has(String(id))));
 if(kokosOrganizeAnchor&&!valid.has(String(kokosOrganizeAnchor)))kokosOrganizeAnchor=null;
 return live;
}

   if(source.images?.length)await sbWrite('product_images',source.images.map((url,i)=>({product_id:newId,image_url:url,sort_order:i})));
   const sizes=['S','M','L','XL','2XL'];
   const inventory=sizes.map(size=>({product_id:newId,size,quantity:Math.max(0,Number(source.stock?.[size])||0)}));
   await kokosV30SaveInventory(newId,inventory);
   if(source.version==='varios'){
    const rows=await sbTable('site_settings'),st=rows[0];
    if(st?.id){const content={...(st.content||{})};const vv={...(content.variosVariants||{})};vv[newId]=JSON.parse(JSON.stringify(vv[id]||[]));content.variosVariants=vv;await sbWrite('site_settings',{content},'PATCH','id=eq.'+encodeURIComponent(st.id))}
   }
  }else{
   await sbWrite('order_catalogs',{id:newId,name,slug,description:source.description||'',price:source.price===''?null:source.price,cover_image_url:source.images?.[0]||null,catalog_type:source.type||'external',external_url:source.url||null,published:source.visible!==false});
   if(source.images?.length>1)await sbWrite('order_catalog_images',source.images.slice(1).map((url,i)=>({catalog_id:newId,image_url:url,sort_order:i})));
  }
  await loadCloud();kokosOrganizerReset();render(false);alert('Copia creada. Puedes editarla independientemente del original.');
 }catch(e){alert('No se pudo completar la duplicación: '+e.message)}
}

// V33: publica el orden que ya fue validado en el organizador privado.
// El orden local se conserva como respaldo; la publicación solo se confirma tras leer Supabase.
kokosOrganizerSave=async function(){
 if(!isLogged())return alert('Inicia sesión para publicar el orden.');
 const kind=adminTab,category=kokosOrganizeCategory;

 if(button){button.disabled=true;button.textContent='PUBLICANDO...'}
 try{
  // Mantiene las otras categorías en su posición relativa y aplica el nuevo orden a la categoría actual.

  const byId=new Map(all.map(p=>[String(p.id),p]));
  let index=0;
  const ordered=all.map(p=>allowed.has(String(p.id))?byId.get(draft[index++]):p);
  if(ordered.some(p=>!p))throw Error('No se pudo reconstruir la lista de productos.');
  const ids=ordered.map(p=>String(p.id));
  const settings=await sbTable('site_settings');
  const st=settings[0];
  if(!st?.id)throw Error('No se encontró el registro de configuración.');
  const field=kind==='products'?'productDisplayOrder':'catalogDisplayOrder';
  const content={...(st.content||{}),[field]:ids};
  const response=await sbRequest('/rest/v1/site_settings?id=eq.'+encodeURIComponent(st.id)+'&select=id,content',{
   method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:{content}
  });
  if(!Array.isArray(response)||response.length!==1)throw Error('Supabase no permitió actualizar site_settings. Es necesario revisar la política UPDATE (RLS).');
  const verify=await sbTable('site_settings','id=eq.'+encodeURIComponent(st.id));
  const actual=verify[0]?.content?.[field];
  if(!Array.isArray(actual)||actual.map(String).join('|')!==ids.join('|'))throw Error('Supabase no conservó el orden publicado.');
  kokosPublicOrder[kind]=ids;
  if(kind==='products')data.products=ordered;else data.catalogs=ordered;
  const local=kokosV32Stored();local[kind+':'+category]=draft;
  localStorage.setItem(kokosV32OrderKey,JSON.stringify(local));
  kokosOrganizeDirty=false;kokosOrganizeSelected.clear();render(false);
  alert('Orden PUBLICADO y verificado en Supabase. Los clientes verán esta distribución.');
 }catch(e){
  alert('No se pudo publicar el orden. Tu organización actual permanece en pantalla.\n\n'+e.message);
 }finally{
  const b=document.querySelector('.kokos-organizer-toolbar button.blue');
  if(b){b.textContent='PUBLICAR ORDEN PARA CLIENTES';b.disabled=!kokosOrganizeDirty}
 }
};

// V35: eliminación confirmada, referencias relacionadas y limpieza segura de fotos no compartidas.
deleteItem=async function(id){
 if(!isLogged())return alert('Inicia sesión.');
 if(!confirm('¿Eliminar definitivamente este producto, su inventario y sus fotografías exclusivas? Esta acción no se puede deshacer.'))return;
 const kind=adminTab,prod=kind==='products',table=prod?'products':'order_catalogs';
 const p=(prod?data.products:data.catalogs).find(x=>String(x.id)===String(id));
 if(!p)return alert('No se encontró el producto.');
 try{
  const photos=[...(p.images||[])];
  // Primero borrar el producto. Si hay claves foráneas sin cascada, detenerse sin borrar los archivos.
  const result=await sbRequest('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id)+'&select=id',{method:'DELETE',auth:true,headers:{Prefer:'return=representation'}});
  if(!Array.isArray(result)||result.length!==1)throw Error('Supabase no confirmó la eliminación. Revisa las políticas o relaciones de la base de datos.');
  const remaining=await sbTable(table,'id=eq.'+encodeURIComponent(id));
  if(remaining.length)throw Error('El producto todavía existe en Supabase.');
  // Si la base no tiene ON DELETE CASCADE, eliminar registros huérfanos después de confirmar el producto.
  await sbRequest('/rest/v1/'+(prod?'product_inventory':'order_catalog_images')+'?'+(prod?'product_id':'catalog_id')+'=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});
  if(prod)await sbRequest('/rest/v1/product_images?product_id=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});
  try{await kokosV35CleanupStorage(photos)}catch(e){console.warn('Limpieza de archivos pendiente:',e)}
  editing=null;kokosOrganizeSelected.delete(String(id));
  kokosOrganizeDraft=kokosOrganizeDraft.filter(x=>String(x)!==String(id));
  await loadCloud();kokosOrganizerReset();render(false);alert('Producto eliminado. Se conservaron las fotografías compartidas con otros productos.');
 }catch(e){alert('No se pudo completar la eliminación: '+e.message)}
};

// V36: se carga tras todas las extensiones de V35.
(function(){
 const previousAdmin=admin;
 admin=function(){
  const html=previousAdmin();
  if(!isLogged())return html;
  return html.replace('<div class="admin-layout">',`<div id="kokos-v36-controls"><h3>EDICIÓN PRIVADA · V36</h3><p>Los cambios guardados en este panel quedarán pendientes. Tus clientes seguirán viendo la última versión publicada. Cuando termines, revisa la vista previa y publica todo junto.</p><div class="actions"><button type="button" onclick="kokosV36Preview('desktop')">👁 PREVISUALIZAR ORDENADOR</button><button type="button" onclick="kokosV36Preview('mobile')">📱 PREVISUALIZAR CELULAR</button><button type="button" class="publish" onclick="kokosV36Publish()">PUBLICAR TODOS LOS CAMBIOS</button></div></div><div class="admin-layout">`);
 };
 // V36: todos los accesos REST de administración apuntan a tablas privadas.
 // El público anónimo sigue consultando las tablas publicadas.
 const kokosV36BaseRequest=sbRequest;
 const kokosV36DraftTables=new Set(['products','product_inventory','product_images','order_catalogs','order_catalog_images','site_settings','collaborations']);
 sbRequest=async function(path,options={}){
  const match=path.match(/^\/rest\/v1\/([a-z_]+)(?=[?]|$)/);
  if(match && kokosV36DraftTables.has(match[1]) && options.auth===true && isLogged()){
   path=path.replace('/rest/v1/'+match[1],'/rest/v1/kokos_draft_'+match[1]);
  }
  return kokosV36BaseRequest(path,options);
 };
 // Solo para la vista previa: renderizar como cliente, pero con datos del borrador.
 // La sesión del administrador se comparte en el iframe del mismo origen.
 const kokosV36PreviewMode=new URLSearchParams(location.search).get('kokos_preview')==='1';
 if(kokosV36PreviewMode){
  const originalLoad=loadCloud;
  loadCloud=async function(){
   if(!isLogged()){
    document.getElementById('app').innerHTML='<section class="content"><h2>Vista previa privada</h2><p>Inicia sesión como administrador antes de abrir esta vista.</p></section>';
    return;
   }
   return originalLoad();
  };
 }
 // V35 eliminaba archivos físicos al quitar productos. En V36 deben conservarse
 // porque todavía pueden estar visibles en el catálogo público anterior.
 kokosV35CleanupStorage=async function(){return;};
 window.kokosV36Preview=function(mode){
  if(!isLogged())return alert('Inicia sesión como administrador.');
  const existing=document.getElementById('kokos-v36-modal');if(existing)existing.remove();
  const modal=document.createElement('div');modal.id='kokos-v36-modal';
  const mobile=mode==='mobile';
  modal.innerHTML=`<div class="toolbar"><strong>VISTA PREVIA PRIVADA · ${mobile?'CELULAR':'ORDENADOR'}</strong><button type="button" id="kokos-v36-close">CERRAR VISTA PREVIA ✕</button></div><iframe title="Previsualización de Kokos Retro" style="width:${mobile?'390px':'1200px'}" src="${location.pathname}?kokos_preview=1#home"></iframe>`;
  document.body.appendChild(modal);
  document.getElementById('kokos-v36-close').onclick=()=>modal.remove();
 };
 window.kokosV36Publish=async function(){
  if(!isLogged())return alert('Inicia sesión como administrador.');
  if(!confirm('¿Publicar TODOS los cambios guardados? Tu tienda pública se actualizará ahora.'))return;
  const btn=document.querySelector('#kokos-v36-controls button.publish');
  if(btn){btn.disabled=true;btn.textContent='PUBLICANDO...';}
  try{
   const result=await sbRequest('/rest/v1/rpc/kokos_publish_draft',{method:'POST',auth:true,body:{}});
   if(!result || result.success!==true)throw Error('Supabase no confirmó la publicación.');
   alert('¡Publicación completada! Los clientes ya pueden ver la nueva versión.');
   await loadCloud();
  }catch(e){alert('No se pudo publicar. Los cambios privados se conservan.\n\n'+e.message);}
  finally{if(btn){btn.disabled=false;btn.textContent='PUBLICAR TODOS LOS CAMBIOS';}}
 };
})();
</script>

 };

 kokosUploadPhotos=async function(fileInputId,targetId){

 };
 window.kokosGalleryUrls=function(){return (document.getElementById('edimages')?.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)};
 window.kokosGalleryRefresh=function(){

 };
 window.kokosGalleryMove=function(from,to){
  const a=kokosGalleryUrls();if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;

 };
 window.kokosGalleryRemove=function(i){
  const a=kokosGalleryUrls();if(i<0||i>=a.length)return;

 };

.kokos-campaign-body{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(22px,5vw,55px);max-width:75%;pointer-events:none}
.kokos-campaign-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:#ffc400;color:#091e34;border-radius:50px;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:16px}
.kokos-campaign-eyebrow:before{content:"";height:7px;width:7px;background:#061e39;border-radius:50%;box-shadow:0 0 0 4px #061e3922;animation:kokosCampaignPulse 2.5s ease-in-out infinite}
@keyframes kokosCampaignPulse{50%{box-shadow:0 0 0 8px #061e3900}}
.kokos-campaign-title{font:clamp(26px,4.5vw,57px)/.98 'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-1.5px;margin:0 0 13px;overflow-wrap:anywhere;text-shadow:0 3px 18px #00172b99}
.kokos-campaign-description{font-size:clamp(12px,1.5vw,16px);line-height:1.5;max-width:480px;margin:0;white-space:pre-line;text-shadow:0 2px 12px #00172baa}
.kokos-campaign-cta{display:inline-flex;margin-top:18px;background:#ffc400;color:#081e34;font-weight:900;border-radius:7px;padding:11px 17px;font-size:12px;letter-spacing:.3px}
.kokos-campaign-link{display:block;cursor:pointer;position:absolute;inset:0;z-index:4;border:0;background:transparent;width:100%;height:100%;text-indent:-9999px}
.kokos-campaign-link:focus-visible{outline:4px solid #ffc400;outline-offset:-4px}
.kokos-campaign-stock{margin:0 0 26px}
.kokos-campaign-stock img{height:clamp(200px,29vw,315px)}
.kokos-campaign-stock .kokos-campaign-body{max-width:80%}
.kokos-campaign-stock .kokos-campaign-cta{display:none}
.kokos-campaign-editor-preview{position:relative;max-width:600px;margin:12px 0;border-radius:12px;overflow:hidden;background:#0b2340;color:#fff}
.kokos-campaign-editor-preview img{width:100%;height:210px;object-fit:cover;display:block}
.kokos-campaign-editor-preview div{position:absolute;bottom:0;left:0;right:0;padding:18px;background:linear-gradient(transparent,#001a33de)}
@media(max-width:700px){.kokos-campaign{margin:15px 4% 4px;border-radius:12px}.kokos-campaign img{height:270px}.kokos-campaign:before{background:linear-gradient(0deg,#001328ef 0%,#001328a6 45%,#0013281c 100%)}.kokos-campaign-body{max-width:100%;justify-content:flex-end;padding:19px 18px 22px}.kokos-campaign-eyebrow{font-size:10px;margin-bottom:10px}.kokos-campaign-title{font-size:clamp(24px,7vw,38px);letter-spacing:-.8px;margin-bottom:8px}.kokos-campaign-description{font-size:12px}.kokos-campaign-cta{margin-top:11px}.kokos-campaign-stock img{height:240px}}
@media(prefers-reduced-motion:reduce){.kokos-campaign:after,.kokos-campaign-eyebrow:before{animation:none}}

/* V40 · responsive campaign strip. Active only with a configured campaign. */
.kokos-campaign-home{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr);margin:0;background:#071b33;border-radius:0;min-height:255px;box-shadow:none}
.kokos-campaign-home:before{display:none}
.kokos-campaign-home .kokos-campaign-art{min-width:0;position:relative;overflow:hidden}
.kokos-campaign-home picture,.kokos-campaign-stock picture{display:block;height:100%}
.kokos-campaign-home img{height:100%;width:100%;min-height:255px;object-fit:cover}
.kokos-campaign-home .kokos-campaign-side{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:25px clamp(22px,3vw,42px);background:linear-gradient(120deg,#071b33,#103967);min-width:0}
.kokos-campaign-home .kokos-campaign-title{font-size:clamp(23px,3vw,40px);line-height:1.03;letter-spacing:-.8px}
.kokos-campaign-home .kokos-campaign-description{font-size:13px;line-height:1.55}
.kokos-campaign-home .kokos-campaign-cta{border:0;cursor:pointer;text-decoration:none;font-family:Inter,Arial,sans-serif;margin-top:20px}
.kokos-campaign-home .kokos-campaign-cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.kokos-campaign-stock{margin:0 0 24px;border-radius:13px;box-shadow:none}
.kokos-campaign-stock:before,.kokos-campaign-stock:after{display:none}
.kokos-campaign-stock img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover}
@media(max-width:700px){
.kokos-campaign-home{display:block;margin:0;border-radius:0;min-height:0;position:relative}
.kokos-campaign-home .kokos-campaign-art{height:auto;aspect-ratio:6/5}
.kokos-campaign-home img{height:100%;min-height:0;object-fit:cover}
.kokos-campaign-home .kokos-campaign-side{position:absolute;inset:0;justify-content:flex-end;align-items:flex-start;padding:25px 20px;background:linear-gradient(0deg,#04172be8 0%,#04172b66 40%,transparent 75%);pointer-events:none}
.kokos-campaign-home .kokos-campaign-title{font-size:clamp(20px,6vw,30px);max-width:90%;margin-bottom:5px}
.kokos-campaign-home .kokos-campaign-description{display:none}
.kokos-campaign-home .kokos-campaign-eyebrow{font-size:9px;padding:6px 9px;margin-bottom:8px}
.kokos-campaign-home .kokos-campaign-cta{pointer-events:auto;margin-top:9px;font-size:11px;padding:11px 15px}
.kokos-campaign-stock{margin:0 0 18px;border-radius:10px}
.kokos-campaign-stock img{height:auto;max-height:none;aspect-ratio:6/5;object-fit:cover}
}
</style>
<script>
/* V39: campaign content stored in site_settings.content, inside the existing draft/publish workflow. */
(function(){
 let campaign={enabled:false,image:'',title:'PROMOCIONES ESPECIALES',description:'Descubre las ofertas disponibles en nuestro stock.',mobileImage:''};
 const defaults={...campaign};
 function normalize(x){return {...defaults,...(x&&typeof x==='object'?x:{})};}
 function card(stock){
  if(!campaign.enabled||!campaign.image)return '';
  const cls=stock?'kokos-campaign kokos-campaign-stock':'kokos-campaign kokos-campaign-home';
  const pic=`<picture>${campaign.mobileImage?`<source media="(max-width:700px)" srcset="${image(campaign.mobileImage)}">`:''}<img src="${image(campaign.image)}" alt="${esc(campaign.title||'Promoción Kokos Retro')}" loading="lazy"></picture>`;
  if(stock)return `<section class="${cls}" aria-label="Promociones de Kokos Retro">${pic}</section>`;
  return `<section class="${cls}" aria-label="Promociones de Kokos Retro"><div class="kokos-campaign-art" role="img" aria-label="${esc(campaign.title||'Promoción Kokos Retro')}">${pic}</div><div class="kokos-campaign-side"><span class="kokos-campaign-eyebrow">KOKOS RETRO · PROMOCIONES</span><h2 class="kokos-campaign-title">${esc(campaign.title)}</h2>${campaign.description?`<p class="kokos-campaign-description">${esc(campaign.description)}</p>`:''}<button type="button" class="kokos-campaign-cta" onclick="go('stock')">VER OFERTAS <span aria-hidden="true">→</span></button></div></section>`;
 }

 const priorRender=render;
 render=function(...args){
  priorRender(...args);
  const route=decodeURIComponent(location.hash.slice(1)||'home');
  const app=document.getElementById('app');if(!app)return;
  if(route==='home'){
   const hero=app.querySelector('section.hero');
   if(hero)hero.insertAdjacentHTML('afterend',card(false));
  }else if(route==='stock'){
   const content=app.querySelector('section.content');
   if(content){const title=content.querySelector('h1.heading');if(title)title.insertAdjacentHTML('beforebegin',card(true));}
  }
 };
 const priorAdmin=admin;
 admin=function(){
  if(!isLogged())return priorAdmin();
  const html=priorAdmin();
  const tab=`<button class="${adminTab==='campaign'?'active':''}" onclick="adminTab='campaign';editing=null;render(false)">PROMOCIONES</button>`;
  if(adminTab==='campaign'){
   const start=html.indexOf('<div class="admin-nav">');
   if(start<0)return html;
   const navEnd=html.indexOf('</div>',start);
   return html.slice(0,navEnd)+tab+html.slice(navEnd,navEnd+6)+'<div>'+campaignAdmin()+'</div></div></section>';
  }
  return html.replace('<button onclick="sbLogout()">Salir</button>',tab+'<button onclick="sbLogout()">Salir</button>');
 };
 window.campaignAdmin=function(){
  return `<h2>CAMPAÑA DE PROMOCIONES</h2><p class="small">Opcional. Aparece justo debajo de la portada de Inicio y al principio de Stock. Si la desactivas, ambos apartados desaparecen y la web vuelve a su estructura habitual. Los cambios quedan privados hasta que publiques.</p><div class="admin-card" style="border-color:#ffc400;background:#fffaf0"><label style="display:flex;align-items:center;gap:12px;font-weight:900"><input id="campaign_enabled" type="checkbox" ${campaign.enabled?'checked':''} style="width:21px;height:21px;accent-color:#0067f5"> ACTIVAR CAMPAÑA DE PROMOCIONES</label><p class="small">La imagen de Inicio lleva a Stock. En Stock es solamente una imagen, sin enlace.</p><div class="field"><label>Imagen para computadora (URL) · Recomendado 1600 × 700 px</label><input id="campaign_image" value="${esc(campaign.image)}" oninput="campaignPreview()" placeholder="https://..."></div><div class="field"><label>Subir imagen para computadora</label><input id="campaign_file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn outline" onclick="kokosUploadPhotos('campaign_file','campaign_image').then(campaignPreview)">SUBIR IMAGEN</button></div><div class="field"><label>Imagen para celular (opcional) · Recomendado 1080 × 900 px</label><input id="campaign_mobile_image" value="${esc(campaign.mobileImage||'')}" oninput="campaignPreview()" placeholder="Si la dejas vacía, se usará la imagen de computadora"></div><div class="field"><label>Subir imagen para celular</label><input id="campaign_mobile_file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><button class="btn outline" onclick="kokosUploadPhotos('campaign_mobile_file','campaign_mobile_image').then(campaignPreview)">SUBIR IMAGEN CELULAR</button></div><div class="field"><label>Título principal</label><input id="campaign_title" maxlength="100" value="${esc(campaign.title)}" oninput="campaignPreview()"></div><div class="field"><label>Texto descriptivo</label><textarea id="campaign_description" maxlength="320" oninput="campaignPreview()">${esc(campaign.description)}</textarea></div><p class="small"><b>Tamaños recomendados:</b> computadora 1600 × 700 px, celular 1080 × 900 px. Deja texto y logos importantes lejos de los bordes para evitar recortes.</p><h3>VISTA PREVIA DEL BANNER</h3><div id="campaign_preview"></div><button class="btn blue" onclick="campaignSave()">GUARDAR CAMPAÑA EN BORRADOR</button></div>`;
 };
 window.campaignPreview=function(){
  const node=document.getElementById('campaign_preview');if(!node)return;
  const url=document.getElementById('campaign_image')?.value.trim();
  const title=document.getElementById('campaign_title')?.value.trim()||'PROMOCIONES ESPECIALES';
  const desc=document.getElementById('campaign_description')?.value.trim()||'';
  node.innerHTML=`<div class="kokos-campaign-editor-preview">${url?`<img src="${image(url)}" alt="Vista previa">`:'<div style="height:210px"></div>'}<div><strong>${esc(title)}</strong><p>${esc(desc)}</p></div></div>`;
 };
 const previousRender=render;
 render=function(...args){previousRender(...args);if((location.hash.slice(1)||'home')==='admin'&&adminTab==='campaign')campaignPreview();};
 const previousLoad=loadCloud;
 loadCloud=async function(...args){
  await previousLoad(...args);
  if(!window.kokosCloudReady)return;
  try{
   const rows=await sbTable('site_settings');campaign=normalize(rows[0]?.content?.promoCampaign);
   if(['home','stock','admin'].includes((location.hash.slice(1)||'home')))render(false);
  }catch(e){console.warn('No se pudo cargar la campaña de promociones:',e)}
 };
 window.campaignSave=async function(){
  if(!isLogged())return alert('Inicia sesión como administrador.');
  const enabled=!!document.getElementById('campaign_enabled')?.checked;
  const img=document.getElementById('campaign_image')?.value.trim()||'';
  const title=document.getElementById('campaign_title')?.value.trim()||'';
  const description=document.getElementById('campaign_description')?.value.trim()||'';
  const mobileImage=document.getElementById('campaign_mobile_image')?.value.trim()||'';
  if(enabled&&!img)return alert('Sube una imagen antes de activar la campaña.');
  if(enabled&&!title)return alert('Escribe un título para la campaña.');
  try{
   const rows=await sbTable('site_settings'),row=rows[0];if(!row)throw Error('No se encontraron ajustes de la web.');
   const next={enabled,image:img,mobileImage,title,description};
   await sbWrite('site_settings',{content:{...(row.content||{}),promoCampaign:next}},'PATCH','id=eq.'+row.id);
   campaign=normalize(next);
   await loadCloud();
   alert('Campaña guardada en el borrador privado. Revisa las vistas previas y publica cuando quieras mostrarla a tus clientes.');
  }catch(e){alert('No se pudo guardar la campaña: '+e.message)}
 };
})();
</script>

</body></html>
