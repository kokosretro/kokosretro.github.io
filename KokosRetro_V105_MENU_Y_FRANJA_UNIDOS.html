const SB_URL='https://viasfdrwmnwpgrkmetdo.supabase.co';
const SB_KEY='sb_publishable_BapiIR515UwsC1e-yCVGxw_b9VDae-M';
let sbSession=null;
const sessionKey='kokos_supabase_session';
// V93: una sesión caducada nunca debe bloquear la lectura pública del catálogo.
function kokosSessionExpired(session){
 if(!session?.access_token)return true;
 let expires=Number(session.expires_at||0);
 if(!expires){
  try{const payload=JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));expires=Number(payload.exp||0)}catch(e){}
 }
 return !!(expires && Date.now()>=expires*1000-30000);
}
function kokosClearExpiredSession(){
 if(sbSession && kokosSessionExpired(sbSession)){
  sbSession=null;
  sessionStorage.removeItem(sessionKey);
 }
}
function getSession(){
 try{
  const session=JSON.parse(sessionStorage.getItem(sessionKey)||'null');
  if(kokosSessionExpired(session)){sessionStorage.removeItem(sessionKey);return null}
  return session;
 }catch(e){sessionStorage.removeItem(sessionKey);return null}
}
function isLogged(){kokosClearExpiredSession();return !!(sbSession&&sbSession.access_token)}
async function sbRequest(path,{method='GET',body,auth=false,headers={}}={}){
 const token=auth?sbSession?.access_token:SB_KEY;
 if(auth&&!token)throw Error('Inicia sesión de nuevo.');
 // V36: todas las operaciones del administrador usan tablas privadas de edición.
 // Los visitantes continúan leyendo exclusivamente las tablas públicas originales.
 if(auth && /^\/rest\/v1\//.test(path)){
   path=path.replace(/^\/rest\/v1\/(products|product_inventory|product_images|order_catalogs|order_catalog_images|site_settings|collaborations)(?=[?\/]|$)/,
     (_full,table)=>'/rest/v1/kokos_draft_'+table);
 }
 const res=await fetch(SB_URL+path,{method,headers:{apikey:SB_KEY,Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'}),...headers},body:body===undefined?undefined:JSON.stringify(body)});
 if(!res.ok){
  if(auth && (res.status===401 || res.status===403)){
   // Evitar conservar credenciales inválidas entre visitas.
   sbSession=null;sessionStorage.removeItem(sessionKey);
  }
  let detail=await res.text();throw Error('Supabase ('+res.status+'): '+detail.slice(0,250));
 }
 const txt=await res.text();return txt?JSON.parse(txt):null;
}
async function sbTable(name,params=''){return sbRequest('/rest/v1/'+name+'?select=*'+(params?'&'+params:''),{auth:isLogged()})}
function rowProduct(p,images,inventory){return {id:p.id,name:p.name,version:p.product_type==='player'?'player':'retro',price:p.price??'',description:p.description||'',images:images.filter(x=>x.product_id===p.id).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.image_url),stock:Object.fromEntries(inventory.filter(x=>x.product_id===p.id).map(x=>[x.size,x.quantity])),visible:p.published!==false,slug:p.slug}}
function rowCatalog(c,images){return {id:c.id,name:c.name,type:c.catalog_type==='detail'?'detail':'external',price:c.price??'',description:c.description||'',images:[c.cover_image_url,...images.filter(x=>x.catalog_id===c.id).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.image_url)].filter(Boolean),url:c.external_url||'',visible:c.published!==false,slug:c.slug}}

async function sbLogin(){
 const email=$('adminemail')?.value.trim(),password=$('adminpass')?.value;
 if(!email||!password){alert('Escribe correo y contraseña.');return}
 try{
 const response=await sbRequest('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
 sbSession=response;sessionStorage.setItem(sessionKey,JSON.stringify(response));
 const check=await sbRequest('/rest/v1/admin_users?select=user_id&user_id=eq.'+encodeURIComponent(response.user.id),{auth:true});

 render(false);
 }catch(e){sbSession=null;sessionStorage.removeItem(sessionKey);alert('No se pudo iniciar sesión: '+e.message)}

// V35: edición diferencial: conservar registros sin cambios, y nunca borrar toda la galería para reinsertarla.
async function kokosV35SyncPhotos(table,fk,id,previous,next){
 const oldRows=await sbTable(table,fk+'=eq.'+encodeURIComponent(id));
 const unique=[...new Set(next)];
 if(unique.length!==next.length)throw Error('Hay fotografías repetidas. Elimina las URL duplicadas.');
 const existing=new Map(oldRows.map(r=>[String(r.image_url),r]));
 // Crear primero las nuevas referencias; no tocar las existentes si la inserción falla.
 for(let i=0;i<unique.length;i++){
  const url=unique[i];if(!existing.has(url)){
   const payload={[fk]:id,image_url:url,sort_order:i};
   await sbWrite(table,payload);
  }
 }
 // Actualizar solo posiciones modificadas.
 const current=await sbTable(table,fk+'=eq.'+encodeURIComponent(id));
 for(let i=0;i<unique.length;i++){
  const row=current.find(r=>r.image_url===unique[i]);
  if(row&&Number(row.sort_order)!==i)await sbWrite(table,{sort_order:i},'PATCH','id=eq.'+encodeURIComponent(row.id));
 }
 // Eliminar solo referencias que el usuario quitó.
 for(const row of oldRows){if(!unique.includes(row.image_url))await sbRequest('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(row.id),{method:'DELETE',auth:true})}
 return oldRows.map(r=>r.image_url).filter(url=>!unique.includes(url));
}
async function kokosV35CleanupStorage(urls){
 if(!urls.length)return;
 const [pi,ci,products,catalogs,settings]=await Promise.all([sbTable('product_images'),sbTable('order_catalog_images'),sbTable('products'),sbTable('order_catalogs'),sbTable('site_settings')]);
 const stillUsed=new Set([...pi.map(r=>r.image_url),...ci.map(r=>r.image_url),...products.map(r=>r.cover_image_url),...catalogs.map(r=>r.cover_image_url),...settings.flatMap(r=>[r.hero_image_url,r.stock_cover_url,r.order_cover_url])]);
 const prefix=SB_URL+'/storage/v1/object/public/kokos-images/';
 const removable=[...new Set(urls)].filter(u=>typeof u==='string'&&u.startsWith(prefix)&&!stillUsed.has(u));
 for(const url of removable){
  const path=url.slice(prefix.length);
  if(!/^catalogo\/[a-f0-9-]+\.(jpg|png|webp|avif)$/i.test(path))continue;
  const response=await fetch(SB_URL+'/storage/v1/object/kokos-images/'+path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+sbSession.access_token}});
  if(!response.ok)console.warn('No se pudo limpiar archivo sin referencias:',path,response.status);
 }
}

// V69: carga única, preservación de proporciones y derivados automáticos.
async function k69ConvertImage(file,maxSide,quality){
 if(file.type==='image/svg+xml')throw Error('SVG no permitido.');
 const source=await createImageBitmap(file,{imageOrientation:'from-image'});
 try{
  const scale=Math.min(1,maxSide/Math.max(source.width,source.height));
  const w=Math.max(1,Math.round(source.width*scale)),h=Math.max(1,Math.round(source.height*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(source,0,0,w,h);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo procesar la fotografía.')),'image/webp',quality));
  return blob;
 }finally{source.close();}
}

async function kokosUploadPhotos(fileInputId,targetId){
 if(!isLogged())return alert('Primero inicia sesión como administrador.');
 const input=$(fileInputId),target=$(targetId),files=[...(input?.files||[])];
 if(!target||!files.length)return alert('Selecciona al menos una fotografía.');
 const types=['image/jpeg','image/png','image/webp','image/avif'];
 if(files.some(f=>!types.includes(f.type)||f.size>12*1024*1024))return alert('Selecciona JPG, PNG, WebP o AVIF de hasta 12 MB.');
 const btn=input.nextElementSibling;if(btn)btn.disabled=true;
 const urls=[];
 try{
  for(let i=0;i<files.length;i++){
   const file=files[i],id='k69-'+crypto.randomUUID();
   if(btn)btn.textContent='OPTIMIZANDO '+(i+1)+' / '+files.length;
   // La foto principal conserva el archivo original, como en una galería de alta calidad.
   // Solo las galerías de productos y catálogos generan una miniatura separada.
   const isGallery=targetId==='edimages';
   if(isGallery){
    const thumb=await k69ConvertImage(file,420,.66);
    await k69StorageUpload('miniaturas/'+id+'.webp',thumb);
   }
   const ext=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif' })[file.type];
   const url=await k69StorageUpload('catalogo/'+id+'.'+ext,file);
   urls.push(url);
  }
  target.value=targetId==='edimages'?[target.value.trim(),...urls].filter(Boolean).join('\n'):urls[0];
  input.value='';
  alert(urls.length+' fotografía(s) subidas. Se conserva la foto original; en galerías se genera una miniatura aparte. Pulsa GUARDAR para registrar los cambios.');
 }catch(error){console.error(error);alert('No se completó la subida: '+error.message+'\nLas fotografías ya subidas correctamente en esta operación siguen en Cloudflare R2.');
  if(urls.length)target.value=targetId==='edimages'?[target.value.trim(),...urls].filter(Boolean).join('\n'):urls[0];
 }finally{if(btn){btn.disabled=false;btn.textContent='SUBIR FOTOS';}}
}

let collabTimer=null;
let collabScrollIdleTimer=null;
let collabAutoScrolling=false;
let collabInteractionActive=false;
let collabLastInteraction=0;
let collabNextDelay=2000;
function collabTrack(){return document.getElementById('collab-track')}
function collabCards(){return [...(collabTrack()?.querySelectorAll('.collab')||[])]}
function clearCollabTimers(){
 clearTimeout(collabTimer);
 clearTimeout(collabScrollIdleTimer);
 collabTimer=null;
 collabScrollIdleTimer=null;
}
function scheduleCollabAuto(){
 clearTimeout(collabTimer);
 collabTimer=null;
 const track=collabTrack();
 if(!track||collabCards().length<2)return;
 if(collabInteractionActive)return;
 const delay=Math.max(0,collabNextDelay-(Date.now()-collabLastInteraction));
 collabTimer=setTimeout(()=>{
  if(document.hidden){scheduleCollabAuto();return}
  if(collabInteractionActive||collabAutoScrolling)return;
  slideCollab(1,false);
 },delay);
}
function pauseCollab(){
 collabNextDelay=2500;
 collabInteractionActive=true;
 collabLastInteraction=Date.now();
 clearTimeout(collabTimer);
 collabTimer=null;
}
function finishCollabInteraction(){
 collabLastInteraction=Date.now();
 // Wait for momentum scrolling to settle before starting the 2.5-second manual pause.
 clearTimeout(collabScrollIdleTimer);
 collabScrollIdleTimer=setTimeout(()=>{
  collabInteractionActive=false;
  collabLastInteraction=Date.now();
  scheduleCollabAuto();
 },220);
}
function slideCollab(dir,manual=false){
 const track=collabTrack(),cards=collabCards();
 if(!track||cards.length<2)return;
 if(manual){pauseCollab();collabInteractionActive=false}
 else collabNextDelay=2000;
 const left=track.scrollLeft;
 let i=0;
 for(let j=1;j<cards.length;j++){
  if(Math.abs((cards[j].offsetLeft-cards[0].offsetLeft)-left)<Math.abs((cards[i].offsetLeft-cards[0].offsetLeft)-left))i=j;
 }
 const next=(i+dir+cards.length)%cards.length;
 collabAutoScrolling=true;
 clearTimeout(collabTimer);
 const target=cards[next].offsetLeft-cards[0].offsetLeft;
 track.scrollTo({left:target,behavior:next===0||i===0&&dir<0?'instant':'smooth'});
 // Do not start the countdown until the programmed scroll is finished.
 clearTimeout(collabScrollIdleTimer);
 collabScrollIdleTimer=setTimeout(()=>{
  collabAutoScrolling=false;
  collabLastInteraction=Date.now();
  scheduleCollabAuto();
 },next===0||i===0&&dir<0?80:650);
}
function startCollabCarousel(){
 clearCollabTimers();
 collabAutoScrolling=false;
 collabInteractionActive=false;
 collabLastInteraction=Date.now();
 collabNextDelay=2000;
 const track=collabTrack();
 if(!track||collabCards().length<2)return;
 const onBegin=()=>pauseCollab();
 const onEnd=()=>finishCollabInteraction();
 track.addEventListener('pointerdown',onBegin,{passive:true});
 track.addEventListener('pointerup',onEnd,{passive:true});
 track.addEventListener('pointercancel',onEnd,{passive:true});
 track.addEventListener('touchstart',onBegin,{passive:true});
 track.addEventListener('touchend',onEnd,{passive:true});
 track.addEventListener('touchcancel',onEnd,{passive:true});
 track.addEventListener('wheel',()=>{pauseCollab();finishCollabInteraction()},{passive:true});
 track.addEventListener('scroll',()=>{
  if(collabAutoScrolling)return;
  pauseCollab();
  finishCollabInteraction();
 },{passive:true});
 scheduleCollabAuto();
}
const originalRender=render;

// V30: inventario por clave única. Nunca borrar y reinsertar tallas existentes.
// El upsert usa exactamente la restricción product_inventory(product_id,size).
async function kokosV30SaveInventory(id,rows){
 if(!rows.length)return;
 const unique=new Set(rows.map(r=>String(r.size)));
 if(unique.size!==rows.length)throw Error('Hay tallas repetidas en el formulario.');
 await sbRequest('/rest/v1/product_inventory?on_conflict=product_id,size',{
  method:'POST',auth:true,
  headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:rows
 });
 const saved=await sbTable('product_inventory','product_id=eq.'+encodeURIComponent(id));
 for(const row of rows){
  const found=saved.find(x=>String(x.size)===String(row.size));
  if(!found||Number(found.quantity)!==Number(row.quantity))throw Error('Supabase no confirmó el inventario de talla '+row.size+'. Revisa los permisos de product_inventory.');
 }
}

// V28 — Guardado verificado del orden: no confirmar cambios que Supabase no almacenó.
async function kokosOrganizerSave(){
 if(!isLogged())return alert('Inicia sesión para guardar el orden.');
 if(!kokosOrganizeDirty)return;
 const kind=adminTab,field=kind==='products'?'productDisplayOrder':'catalogDisplayOrder';
 const all=kind==='products'?data.products:data.catalogs;
 const draft=kokosOrganizeDraft.map(String);
 const draftSet=new Set(draft);
 if(draftSet.size!==draft.length||draft.some(id=>!all.some(p=>String(p.id)===id)))return alert('El orden contiene elementos no válidos. Actualiza la página y vuelve a intentarlo.');
 // Conserva las posiciones de las otras categorías y reordena únicamente la categoría activa.
 let index=0;
 const reordered=all.map(p=>draftSet.has(String(p.id))?all.find(x=>String(x.id)===draft[index++]):p);
 const ids=reordered.map(p=>String(p.id));
 const button=document.querySelector('.kokos-organizer-toolbar button.blue');
 if(button){button.disabled=true;button.textContent='GUARDANDO...'}
 try{
  const rows=await sbTable('site_settings');
  const st=rows[0];
  if(!st?.id)throw Error('No se encontró el registro de configuración de Supabase.');
  const content={...(st.content||{}),[field]:ids};
  // return=representation permite detectar actualizaciones rechazadas silenciosamente por RLS.
  const updated=await sbRequest('/rest/v1/site_settings?id=eq.'+encodeURIComponent(st.id)+'&select=id,content',{
   method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:{content}
  });
  if(!Array.isArray(updated)||updated.length!==1)throw Error('Supabase no confirmó la actualización. Revisa los permisos de edición de site_settings.');
  const saved=updated[0]?.content?.[field];
  if(!Array.isArray(saved)||saved.map(String).join('|')!==ids.join('|'))throw Error('El orden devuelto por Supabase no coincide con el solicitado.');
  // Lectura nueva para confirmar persistencia antes de mostrar éxito.
  const verify=await sbTable('site_settings','id=eq.'+encodeURIComponent(st.id));
  const persisted=verify[0]?.content?.[field];
  if(!Array.isArray(persisted)||persisted.map(String).join('|')!==ids.join('|'))throw Error('No se pudo verificar el orden guardado.');
  kokosPublicOrder[kind]=ids;
  if(kind==='products')data.products=reordered;else data.catalogs=reordered;
  kokosOrganizeDirty=false;
  kokosOrganizerReset();
  render(false);
  alert('Orden guardado y verificado en Supabase.');
 }catch(e){
  if(button){button.disabled=false;button.textContent='GUARDAR ORDEN'}
  alert('No se pudo guardar el orden: '+e.message);
 }
}

// V29 — Sincronización del panel tras eliminar, cancelar sin salir y guardado consistente.
function kokosV29SyncDraft(){
 const live=kokosOrganizerItems().map(p=>String(p.id)),valid=new Set(live);
 const prior=kokosOrganizeDraft.filter(id=>valid.has(String(id))).map(String);
 const seen=new Set(prior);
 kokosOrganizeDraft=[...prior,...live.filter(id=>!seen.has(id))];
 kokosOrganizeSelected=new Set([...kokosOrganizeSelected].filter(id=>valid.has(String(id))));
 if(kokosOrganizeAnchor&&!valid.has(String(kokosOrganizeAnchor)))kokosOrganizeAnchor=null;
 return live;
}

  const actual=updated[0]?.content?.[field];
  if(!Array.isArray(actual)||actual.map(String).join('|')!==ids.join('|'))throw Error('Supabase devolvió un orden diferente.');
  const check=await sbTable('site_settings','id=eq.'+encodeURIComponent(st.id));
  if(check[0]?.content?.[field]?.map(String).join('|')!==ids.join('|'))throw Error('El orden no persistió en Supabase.');
  kokosPublicOrder[kind]=ids;
  if(kind==='products')data.products=ordered;else data.catalogs=ordered;
  kokosOrganizeDirty=false;kokosOrganizerReset();render(false);
  alert('Orden guardado correctamente. Los clientes verán esta distribución.');
 }catch(e){
  if(btn){btn.disabled=false;btn.textContent='GUARDAR ORDEN'}
  alert('No se pudo guardar el orden: '+e.message+'\nSi aparece un error 403 o Supabase no confirma la actualización, revisa los permisos UPDATE de site_settings.');
 }
}

// V31 — Movimiento fiable: botones de posición + arrastre táctil.
function kokosV31Move(id,delta){
 const visible=new Set(kokosV27Filtered().map(p=>String(p.id)));
 const shown=kokosOrganizeDraft.filter(x=>visible.has(x));
 const at=shown.indexOf(String(id)),target=at+delta;
 if(at<0||target<0||target>=shown.length)return;
 const other=shown[target],a=kokosOrganizeDraft.indexOf(String(id)),b=kokosOrganizeDraft.indexOf(other);
 [kokosOrganizeDraft[a],kokosOrganizeDraft[b]]=[kokosOrganizeDraft[b],kokosOrganizeDraft[a]];
 kokosOrganizeDirty=true;kokosOrganizerRefresh();
}
const kokosV31Card=kokosOrganizerCard;
kokosOrganizerCard=function(p,i){
 let html=kokosV31Card(p,i);
 const id=String(p.id),visible=kokosOrganizeDraft.filter(x=>new Set(kokosV27Filtered().map(p=>String(p.id))).has(x));
 const at=visible.indexOf(id);
 const controls=`<div class="kokos-v31-move"><button type="button" class="btn outline" ${at<=0?'disabled':''} onclick="event.stopPropagation();kokosV31Move('${esc(id)}',-1)" aria-label="Subir producto">↑ SUBIR</button><button type="button" class="btn outline" ${at>=visible.length-1?'disabled':''} onclick="event.stopPropagation();kokosV31Move('${esc(id)}',1)" aria-label="Bajar producto">↓ BAJAR</button></div>`;
 return html.replace('<div class="kokos-v27-actions">',controls+'<div class="kokos-v27-actions">');
};
// En pantallas táctiles, el navegador no inicia dragstart de HTML5.
let kokosV31Touch=null;
document.addEventListener('pointerdown',ev=>{
 if(ev.pointerType==='mouse'||!kokosOrganizeMode)return;
 const card=ev.target.closest('#kokosVisualGrid .kokos-visual-item');
 if(!card||ev.target.closest('button,input,select'))return;
 kokosV31Touch={id:card.dataset.id,x:ev.clientX,y:ev.clientY,moved:false};
},{passive:true});
document.addEventListener('pointermove',ev=>{
 if(!kokosV31Touch)return;
 if(Math.hypot(ev.clientX-kokosV31Touch.x,ev.clientY-kokosV31Touch.y)>12)kokosV31Touch.moved=true;
},{passive:true});
document.addEventListener('pointerup',ev=>{
 const t=kokosV31Touch;kokosV31Touch=null;
 if(!t||!t.moved)return;
 const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#kokosVisualGrid .kokos-visual-item');
 if(!target||target.dataset.id===t.id)return;
 const moving=kokosOrganizeDraft.indexOf(t.id),to=kokosOrganizeDraft.indexOf(target.dataset.id);
 if(moving<0||to<0)return;
 const next=[...kokosOrganizeDraft];next.splice(moving,1);next.splice(to,0,t.id);
 kokosOrganizeDraft=next;kokosOrganizeDirty=true;kokosOrganizerRefresh();
},{passive:true});
document.addEventListener('pointercancel',()=>{kokosV31Touch=null},{passive:true});
// Botón guardado siempre se habilita al modificar la lista.
const kokosV31Paint=kokosOrganizerPaint;
kokosOrganizerPaint=function(){kokosV31Paint();const b=document.querySelector('.kokos-organizer-toolbar button.blue');if(b)b.disabled=!kokosOrganizeDirty};

// V32: prueba de orden EXCLUSIVAMENTE privado, guardado en este navegador.
// No escribe productDisplayOrder ni catalogDisplayOrder en Supabase.
const kokosV32OrderKey='kokosretro_admin_private_order_v32';
function kokosV32Stored(){try{return JSON.parse(localStorage.getItem(kokosV32OrderKey)||'{}')}catch(_){return {}}}
function kokosV32OrderIds(){const all=kokosOrganizerItems().map(p=>String(p.id));const stored=kokosV32Stored()[adminTab+':'+kokosOrganizeCategory]||[];const allowed=new Set(all),used=new Set();return [...stored,...all].map(String).filter(id=>allowed.has(id)&&!used.has(id)&&used.add(id))}
kokosOrganizerReset=function(){kokosOrganizeDraft=kokosV32OrderIds();kokosOrganizeSelected.clear();kokosOrganizeAnchor=null;kokosOrganizeDirty=false;kokosV27Size='all'};
kokosV29SyncDraft=function(){const live=kokosOrganizerItems().map(p=>String(p.id)),valid=new Set(live);const prior=kokosOrganizeDraft.filter(id=>valid.has(String(id))).map(String);const seen=new Set(prior);kokosOrganizeDraft=[...prior,...live.filter(id=>!seen.has(id))];kokosOrganizeSelected=new Set([...kokosOrganizeSelected].filter(id=>valid.has(String(id))));return live};
kokosOrganizerSave=async function(){
 if(!isLogged())return alert('Inicia sesión.');
 const ids=kokosOrganizeDraft.map(String),live=kokosOrganizerItems().map(p=>String(p.id));
 if(ids.length!==live.length||new Set(ids).size!==ids.length||ids.some(id=>!live.includes(id)))return alert('La lista cambió. Actualiza el panel e inténtalo de nuevo.');
 try{const all=kokosV32Stored();all[adminTab+':'+kokosOrganizeCategory]=ids;localStorage.setItem(kokosV32OrderKey,JSON.stringify(all));kokosOrganizeDirty=false;kokosOrganizeSelected.clear();render(false);alert('Orden privado guardado en este navegador. El público no ha cambiado.')}catch(e){alert('No se pudo guardar el orden privado: '+e.message)}
};
// Pintar la administración según el orden local sin alterar el catálogo público.
const kokosV32OldView=kokosOrganizerView;
kokosOrganizerView=function(){const html=kokosV32OldView();return html.replace('Arrastra para cambiar el orden público.','Arrastra o usa SUBIR/BAJAR para organizar solo tu panel.').replace('Solo el orden que guardes se reflejará en el catálogo público. Los filtros y controles son privados.','PRUEBA PRIVADA: este orden solo se guarda en este navegador. Los clientes seguirán viendo el orden actual.').replace('GUARDAR ORDEN</button>','GUARDAR ORDEN PRIVADO</button>')};
// Duplicar genera un producto real NUEVO, independiente, conservando fotos y tallas.
async function kokosV32Duplicate(id){
 if(!isLogged())return alert('Inicia sesión.');
 if(kokosOrganizeDirty)return alert('Guarda o cancela primero los cambios de orden.');
 const prod=adminTab==='products',source=(prod?data.products:data.catalogs).find(p=>String(p.id)===String(id));
 if(!source)return alert('No se encontró el elemento.');
 if(!confirm('¿Duplicar «'+source.name+'»? Se creará una copia nueva en Supabase, visible en la tienda.'))return;
 const newId=crypto.randomUUID(),name=source.name+' (copia)',slug='copia-'+newId.slice(0,12);
 try{
  if(prod){
   await sbWrite('products',{id:newId,name,slug,description:source.description||'',price:Number(source.price)||0,product_type:source.version,cover_image_url:source.images?.[0]||null,published:source.visible!==false});
   if(source.images?.length)await sbWrite('product_images',source.images.map((url,i)=>({product_id:newId,image_url:url,sort_order:i})));
   const sizes=['S','M','L','XL','2XL'];
   const inventory=sizes.map(size=>({product_id:newId,size,quantity:Math.max(0,Number(source.stock?.[size])||0)}));
   await kokosV30SaveInventory(newId,inventory);
   if(source.version==='varios'){
    const rows=await sbTable('site_settings'),st=rows[0];
    if(st?.id){const content={...(st.content||{})};const vv={...(content.variosVariants||{})};vv[newId]=JSON.parse(JSON.stringify(vv[id]||[]));content.variosVariants=vv;await sbWrite('site_settings',{content},'PATCH','id=eq.'+encodeURIComponent(st.id))}
   }
  }else{
   await sbWrite('order_catalogs',{id:newId,name,slug,description:source.description||'',price:source.price===''?null:source.price,cover_image_url:source.images?.[0]||null,catalog_type:source.type||'external',external_url:source.url||null,published:source.visible!==false});
   if(source.images?.length>1)await sbWrite('order_catalog_images',source.images.slice(1).map((url,i)=>({catalog_id:newId,image_url:url,sort_order:i})));
  }
  await loadCloud();kokosOrganizerReset();render(false);alert('Copia creada. Puedes editarla independientemente del original.');
 }catch(e){alert('No se pudo completar la duplicación: '+e.message)}
}
const kokosV32OldCard=kokosOrganizerCard;
kokosOrganizerCard=function(p,i){const html=kokosV32OldCard(p,i);const control=`<button type="button" class="btn outline" onclick="event.stopPropagation();kokosV32Duplicate('${esc(String(p.id))}')">DUPLICAR</button>`;return html.replace('<div class="kokos-v27-actions">','<div class="kokos-v27-actions">'+control)};


// V34: corrección del cursor de reconstrucción de productos.
// V33: publica el orden que ya fue validado en el organizador privado.
// El orden local se conserva como respaldo; la publicación solo se confirma tras leer Supabase.
kokosOrganizerSave=async function(){
 if(!isLogged())return alert('Inicia sesión para publicar el orden.');
 const kind=adminTab,category=kokosOrganizeCategory;
 const current=kokosOrganizerItems().map(p=>String(p.id));
 const draft=kokosOrganizeDraft.map(String);
 const allowed=new Set(current);
 if(draft.length!==current.length||new Set(draft).size!==draft.length||draft.some(id=>!allowed.has(id))){
  return alert('Los productos cambiaron desde que abriste el organizador. Actualiza el panel antes de publicar.');
 }
 const button=document.querySelector('.kokos-organizer-toolbar button.blue');
 if(button){button.disabled=true;button.textContent='PUBLICANDO...'}
 try{
  // Mantiene las otras categorías en su posición relativa y aplica el nuevo orden a la categoría actual.
  const all=kind==='products'?data.products:data.catalogs;
  // Avanzar el cursor UNA vez por posición; nunca dentro del predicado de find().
  const byId=new Map(all.map(p=>[String(p.id),p]));
  let index=0;
  const ordered=all.map(p=>allowed.has(String(p.id))?byId.get(draft[index++]):p);
  if(ordered.some(p=>!p))throw Error('No se pudo reconstruir la lista de productos.');
  const ids=ordered.map(p=>String(p.id));
  const settings=await sbTable('site_settings');
  const st=settings[0];
  if(!st?.id)throw Error('No se encontró el registro de configuración.');
  const field=kind==='products'?'productDisplayOrder':'catalogDisplayOrder';
  const content={...(st.content||{}),[field]:ids};
  const response=await sbRequest('/rest/v1/site_settings?id=eq.'+encodeURIComponent(st.id)+'&select=id,content',{
   method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:{content}
  });
  if(!Array.isArray(response)||response.length!==1)throw Error('Supabase no permitió actualizar site_settings. Es necesario revisar la política UPDATE (RLS).');
  const verify=await sbTable('site_settings','id=eq.'+encodeURIComponent(st.id));
  const actual=verify[0]?.content?.[field];
  if(!Array.isArray(actual)||actual.map(String).join('|')!==ids.join('|'))throw Error('Supabase no conservó el orden publicado.');
  kokosPublicOrder[kind]=ids;
  if(kind==='products')data.products=ordered;else data.catalogs=ordered;
  const local=kokosV32Stored();local[kind+':'+category]=draft;
  localStorage.setItem(kokosV32OrderKey,JSON.stringify(local));
  kokosOrganizeDirty=false;kokosOrganizeSelected.clear();render(false);
  alert('Orden PUBLICADO y verificado en Supabase. Los clientes verán esta distribución.');
 }catch(e){
  alert('No se pudo publicar el orden. Tu organización actual permanece en pantalla.\n\n'+e.message);
 }finally{
  const b=document.querySelector('.kokos-organizer-toolbar button.blue');
  if(b){b.textContent='PUBLICAR ORDEN PARA CLIENTES';b.disabled=!kokosOrganizeDirty}
 }
};
const kokosV33OldView=kokosOrganizerView;
kokosOrganizerView=function(){
 return kokosV33OldView()
  .replace('GUARDAR ORDEN PRIVADO</button>','PUBLICAR ORDEN PARA CLIENTES</button>')
  .replace('PRUEBA PRIVADA: este orden solo se guarda en este navegador. Los clientes seguirán viendo el orden actual.','Al publicar, este orden se guardará en Supabase y será visible para los clientes.');
};
// V35: eliminación confirmada, referencias relacionadas y limpieza segura de fotos no compartidas.
deleteItem=async function(id){
 if(!isLogged())return alert('Inicia sesión.');
 if(!confirm('¿Eliminar definitivamente este producto, su inventario y sus fotografías exclusivas? Esta acción no se puede deshacer.'))return;
 const kind=adminTab,prod=kind==='products',table=prod?'products':'order_catalogs';
 const p=(prod?data.products:data.catalogs).find(x=>String(x.id)===String(id));
 if(!p)return alert('No se encontró el producto.');
 try{
  const photos=[...(p.images||[])];
  // Primero borrar el producto. Si hay claves foráneas sin cascada, detenerse sin borrar los archivos.
  const result=await sbRequest('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id)+'&select=id',{method:'DELETE',auth:true,headers:{Prefer:'return=representation'}});
  if(!Array.isArray(result)||result.length!==1)throw Error('Supabase no confirmó la eliminación. Revisa las políticas o relaciones de la base de datos.');
  const remaining=await sbTable(table,'id=eq.'+encodeURIComponent(id));
  if(remaining.length)throw Error('El producto todavía existe en Supabase.');
  // Si la base no tiene ON DELETE CASCADE, eliminar registros huérfanos después de confirmar el producto.
  await sbRequest('/rest/v1/'+(prod?'product_inventory':'order_catalog_images')+'?'+(prod?'product_id':'catalog_id')+'=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});
  if(prod)await sbRequest('/rest/v1/product_images?product_id=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});
  try{await kokosV35CleanupStorage(photos)}catch(e){console.warn('Limpieza de archivos pendiente:',e)}
  editing=null;kokosOrganizeSelected.delete(String(id));
  kokosOrganizeDraft=kokosOrganizeDraft.filter(x=>String(x)!==String(id));
  await loadCloud();kokosOrganizerReset();render(false);alert('Producto eliminado. Se conservaron las fotografías compartidas con otros productos.');
 }catch(e){alert('No se pudo completar la eliminación: '+e.message)}
};

<script>
// V36: se carga tras todas las extensiones de V35.
(function(){
 const previousAdmin=admin;
 admin=function(){
  const html=previousAdmin();
  if(!isLogged())return html;
  return html.replace('<div class="admin-layout">',`<div id="kokos-v36-controls"><h3>EDICIÓN PRIVADA · V36</h3><p>Los cambios guardados en este panel quedarán pendientes. Tus clientes seguirán viendo la última versión publicada. Cuando termines, revisa la vista previa y publica todo junto.</p><div class="actions"><button type="button" onclick="kokosV36Preview('desktop')">👁 PREVISUALIZAR ORDENADOR</button><button type="button" onclick="kokosV36Preview('mobile')">📱 PREVISUALIZAR CELULAR</button><button type="button" class="publish" onclick="kokosV36Publish()">PUBLICAR TODOS LOS CAMBIOS</button></div></div><div class="admin-layout">`);
 };
 // V36: todos los accesos REST de administración apuntan a tablas privadas.
 // El público anónimo sigue consultando las tablas publicadas.
 const kokosV36BaseRequest=sbRequest;
 const kokosV36DraftTables=new Set(['products','product_inventory','product_images','order_catalogs','order_catalog_images','site_settings','collaborations']);
 sbRequest=async function(path,options={}){
  const match=path.match(/^\/rest\/v1\/([a-z_]+)(?=[?]|$)/);
  if(match && kokosV36DraftTables.has(match[1]) && options.auth===true && isLogged()){
   path=path.replace('/rest/v1/'+match[1],'/rest/v1/kokos_draft_'+match[1]);
  }
  return kokosV36BaseRequest(path,options);
 };
 // Solo para la vista previa: renderizar como cliente, pero con datos del borrador.
 // La sesión del administrador se comparte en el iframe del mismo origen.
 const kokosV36PreviewMode=new URLSearchParams(location.search).get('kokos_preview')==='1';
 if(kokosV36PreviewMode){
  const originalLoad=loadCloud;
  loadCloud=async function(){
   if(!isLogged()){
    document.getElementById('app').innerHTML='<section class="content"><h2>Vista previa privada</h2><p>Inicia sesión como administrador antes de abrir esta vista.</p></section>';
    return;
   }
   return originalLoad();
  };
 }
 // V35 eliminaba archivos físicos al quitar productos. En V36 deben conservarse
 // porque todavía pueden estar visibles en el catálogo público anterior.
 kokosV35CleanupStorage=async function(){return;};
 window.kokosV36Preview=function(mode){
  if(!isLogged())return alert('Inicia sesión como administrador.');
  const existing=document.getElementById('kokos-v36-modal');if(existing)existing.remove();
  const modal=document.createElement('div');modal.id='kokos-v36-modal';
  const mobile=mode==='mobile';
  modal.innerHTML=`<div class="toolbar"><strong>VISTA PREVIA PRIVADA · ${mobile?'CELULAR':'ORDENADOR'}</strong><button type="button" id="kokos-v36-close">CERRAR VISTA PREVIA ✕</button></div><iframe title="Previsualización de Kokos Retro" style="width:${mobile?'390px':'1200px'}" src="${location.pathname}?kokos_preview=1#home"></iframe>`;
  document.body.appendChild(modal);
  document.getElementById('kokos-v36-close').onclick=()=>modal.remove();
 };
 window.kokosV36Publish=async function(){
  if(!isLogged())return alert('Inicia sesión como administrador.');
  if(!confirm('¿Publicar TODOS los cambios guardados? Tu tienda pública se actualizará ahora.'))return;
  const btn=document.querySelector('#kokos-v36-controls button.publish');
  if(btn){btn.disabled=true;btn.textContent='PUBLICANDO...';}
  try{
   const result=await sbRequest('/rest/v1/rpc/kokos_publish_draft',{method:'POST',auth:true,body:{}});
   if(!result || result.success!==true)throw Error('Supabase no confirmó la publicación.');
   alert('¡Publicación completada! Los clientes ya pueden ver la nueva versión.');
   await loadCloud();
  }catch(e){alert('No se pudo publicar. Los cambios privados se conservan.\n\n'+e.message);}
  finally{if(btn){btn.disabled=false;btn.textContent='PUBLICAR TODOS LOS CAMBIOS';}}
 };
})();
</script>

<script>
// V37: organizador visual en formularios de Stock y Bajo pedido.
(function(){
 const oldEditForm=editForm;
 editForm=function(){
  const html=oldEditForm();
  return html.replace('<textarea id="edimages"', '<textarea id="edimages"')
   .replace('<span class="small">Puedes subir imágenes desde tu dispositivo con el botón SUBIR FOTOS.</span>', '<span class="small">Puedes subir imágenes desde tu dispositivo con el botón SUBIR FOTOS.</span><div id="kokos-photo-organizer"></div>');
 };
 const oldRender=render;
 render=function(...args){
  const result=oldRender.apply(this,args);
  if(document.getElementById('edimages'))kokosGalleryRefresh();
  return result;
 };
 const oldUpload=kokosUploadPhotos;
 kokosUploadPhotos=async function(fileInputId,targetId){
  await oldUpload(fileInputId,targetId);
  if(targetId==='edimages')kokosGalleryRefresh();
 };
 window.kokosGalleryUrls=function(){return (document.getElementById('edimages')?.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)};
 window.kokosGalleryRefresh=function(){
  const el=document.getElementById('kokos-photo-organizer');if(!el)return;
  const urls=kokosGalleryUrls();
  const cards=urls.map((url,i)=>`<div class="kpg-card" draggable="true" data-photo="${i}" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault();this.classList.add('kpg-dragover')" ondragleave="this.classList.remove('kpg-dragover')" ondrop="event.preventDefault();this.classList.remove('kpg-dragover');kokosGalleryMove(Number(event.dataTransfer.getData('text/plain')),${i})"><div class="kpg-picture"><img decoding="async" loading="lazy" src="${esc(url)}" alt="Fotografía ${i+1}" onerror="this.alt='Imagen no disponible'"><span class="kpg-number">${i===0?'1 · PORTADA':i+1}</span></div><div class="kpg-actions"><button type="button" onclick="kokosGalleryMove(${i},${i-1})" ${i===0?'disabled':''}>← Antes</button><button type="button" onclick="kokosGalleryMove(${i},${i+1})" ${i===urls.length-1?'disabled':''}>Después →</button><button type="button" class="kpg-remove" onclick="kokosGalleryRemove(${i})">Quitar foto</button></div></div>`).join('');
  el.innerHTML=`<h3 style="margin:8px 0">ORDEN DE FOTOGRAFÍAS (${urls.length})</h3><p class="kpg-help">Mira cada foto antes de guardar. La foto 1 será la portada. Usa las flechas o arrastra una fotografía para cambiar su posición. Después pulsa GUARDAR.</p>${urls.length?`<div class="kpg-grid">${cards}</div>`:'<div class="kpg-empty">Todavía no hay fotografías. Súbelas para verlas y organizarlas aquí.</div>'}`;
 };
 window.kokosGalleryMove=function(from,to){
  const a=kokosGalleryUrls();if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;
  a.splice(to,0,a.splice(from,1)[0]);document.getElementById('edimages').value=a.join('\n');kokosGalleryRefresh();
 };
 window.kokosGalleryRemove=function(i){
  const a=kokosGalleryUrls();if(i<0||i>=a.length)return;
  if(!confirm('¿Quitar esta fotografía del producto? No se borrará del almacenamiento.'))return;
  a.splice(i,1);document.getElementById('edimages').value=a.join('\n');kokosGalleryRefresh();
 };
})();
</script>

el>Tamaño del título en celular <output id="promo-mobile-title-size-value"></output><input type="range" id="promo_mobile_title_size" min="16" max="40" step="1" value="${campaign.mobileTitleSize??26}" oninput="campaignPreview()"></label></div><div class="field"><label>Texto descriptivo</label><textarea id="campaign_description" maxlength="320" oninput="campaignPreview()">${esc(campaign.description)}</textarea></div><p class="small"><b>Tamaños recomendados:</b> computadora 1920 × 1080 px (16:9), celular 1080 × 1350 px (4:5). Deja texto y logos importantes lejos de los bordes para evitar recortes.</p><h3>VISTA PREVIA DEL BANNER</h3><div id="campaign_preview"></div><button class="btn blue" onclick="campaignSave()">GUARDAR CAMPAÑA EN BORRADOR</button></div>`;

<script>
/* V42: fixes verified against the actual V41 source.
   The initial request in V41 starts before promo/campaign loaders are registered.
   Also the previous campaign tab tried to render a nonexistent organizer category. */
(function(){
 const oldAdmin=admin;
 admin=function(){
   if(adminTab!=='campaign')return oldAdmin();
   // Render a valid administrator shell first, then swap ONLY its content pane.
   const tab=adminTab;adminTab='products';
   let html;
   try{html=oldAdmin();}finally{adminTab=tab;}
   if(!isLogged())return html;
   const holder=document.createElement('div');holder.innerHTML=html;
   const layout=holder.querySelector('.admin-layout');
   if(!layout)return html;
   const pane=layout.children[1];
   if(pane)pane.innerHTML=campaignAdmin();
   const nav=layout.querySelector('.admin-nav');
   if(nav){
     let promo=[...nav.querySelectorAll('button')].find(b=>b.textContent.trim()==='PROMOCIONES');
     if(!promo){promo=document.createElement('button');promo.textContent='PROMOCIONES';promo.type='button';promo.setAttribute('onclick',"adminTab='campaign';editing=null;render(false)");nav.insertBefore(promo,nav.lastElementChild);}
     nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===promo));
   }
   return holder.innerHTML;
 };
 // Re-run the FINAL cloud loader once after all extension wrappers exist.
 // The old startup loader only fetched products and skipped sale/campaign settings.
 window.addEventListener('DOMContentLoaded',()=>{
   loadCloud().catch(e=>console.error('No se pudo completar la carga V42',e));
 });
})();
</script>

  if(prod&&liqEnabled&&!liqValue)return alert('Para activar la liquidación, introduce primero su precio.');
  const catFields=cat?{freeNameNumber:document.getElementById('k46_free')?.checked===true,reserveEnabled:document.getElementById('k46_reserve_on')?.checked===true,reserveAmount:document.getElementById('k46_reserve_amount')?.value.trim()||''}:null;

  await originalSaveEdit();
  if(editing!==null)return; // El guardado principal no se completó.
  const after=prod?data.products:data.catalogs;
  const id=oldId!=='new'&&oldId!=null?String(oldId):String(after.find(x=>!before.has(String(x.id)))?.id||'');
  if(!id)return alert('El producto se guardó, pero no se pudo identificar para guardar los ajustes adicionales.');
  try{
   if(prod){
    const backup={...kokosPromos},liqBackup={...kokosLiquidations};
    if(liqValue)kokosLiquidations[id]=Number(liqValue);else delete kokosLiquidations[id];
    kokosLiquidations[id+'_enabled']=liqEnabled;
    if(promoValue)kokosPromos[id]=Number(promoValue);else delete kokosPromos[id];
    kokosPromos[id+'_enabled']=promoEnabled;
    try{await kokosPersistPromo()}catch(e){kokosPromos=backup;kokosLiquidations=liqBackup;throw e}
   }
   if(cat)await k46SaveSettingsFeature(id,catFields);
   await loadCloud();
  }catch(e){alert('El elemento se guardó en borrador, pero no se pudo guardar su descuento o beneficio. Revisa estos ajustes antes de publicar.\n'+e.message)}
 };
 loadCloud=async function(){await originalLoadCloud();if(!window.kokosCloudReady)return;
  try{const rows=await sbTable('site_settings');k46CatalogFeatures=rows[0]?.content?.orderCatalogFeatures||{};render(false)}catch(e){console.warn('No se pudieron leer los beneficios bajo pedido',e)}
 };
 render=function(...args){const result=originalRender.apply(this,args);
  const route=decodeURIComponent(location.hash.slice(1)||'home');
  if(route.startsWith('order-detail/')){
   const id=route.slice('order-detail/'.length),cfg=k46Fields(id),target=document.querySelector('#app .product > div:last-child');
   if(target&&(cfg.freeNameNumber||(cfg.reserveEnabled&&k46Valid(cfg.reserveAmount)))){

    const notice=target.querySelector('.notice');if(notice)notice.insertAdjacentHTML('beforebegin',blocks);else target.insertAdjacentHTML('beforeend',blocks);
   }

   const controls=document.getElementById('kokos-v36-controls');

   document.querySelectorAll('.kokos-organizer-toolbar button').forEach(b=>{if(/PUBLICAR ORDEN PARA CLIENTES|GUARDAR ORDEN PRIVADO|GUARDAR ORDEN/.test(b.textContent))b.textContent=b.textContent.replace(/PUBLICAR ORDEN PARA CLIENTES|GUARDAR ORDEN PRIVADO|GUARDAR ORDEN/,'GUARDAR ORDEN EN BORRADOR')});
   k46SetupUploads();

  }

 };
 kokosOrganizerSave=async function(){await originalOrganizer();};
 // Subida automática solamente para la galería de creación/edición.
 function k46SetupUploads(){const f=document.getElementById('edimages');if(!f)return;
  const inputs=[...document.querySelectorAll('input[type=file]')].filter(i=>{const sibling=i.nextElementSibling;return sibling&&/SUBIR FOTOS|SUBIR FOTO/.test(sibling.textContent||'')&&/edimages/.test(sibling.getAttribute('onclick')||'')});
  inputs.forEach(input=>{if(input.dataset.k46Auto)return;input.dataset.k46Auto='1';const btn=input.nextElementSibling;if(btn)btn.style.display='none';
   const status=document.createElement('div');status.className='k46-auto-status';status.textContent='Selecciona las fotos: se subirán automáticamente a la nube.';input.insertAdjacentElement('afterend',status);
   input.addEventListener('change',async()=>{if(!input.files?.length)return;if(k46PendingUpload)return alert('Espera a que termine la subida anterior.');k46PendingUpload=true;status.textContent='Subiendo '+input.files.length+' fotografía(s)...';try{delete input.dataset.k46UploadError;await originalUpload(input.id,'edimages');if(input.dataset.k46UploadError)throw Error(input.dataset.k46UploadError);kokosGalleryRefresh();status.textContent='Fotografías cargadas. Organízalas y pulsa GUARDAR EN BORRADOR.'}catch(e){status.textContent='Error de subida: '+e.message;alert(e.message)}finally{k46PendingUpload=false;input.value=''}});

 // Sustituir alert de subida por aviso en línea solo para fotos de producto.

 function k46SetupGallery(){const box=document.getElementById('kokos-photo-organizer');if(!box)return;
  if(!box.dataset.k46Observer){box.dataset.k46Observer='1';const observer=new MutationObserver(()=>{if(!box.isConnected){observer.disconnect();return}if(box.dataset.k46Busy)return;k46DecorateGallery(box)});observer.observe(box,{childList:true,subtree:false});}

 }
 function k46DecorateGallery(box){if(!box||!box.isConnected)return;box.dataset.k46Busy='1';
  try{
   const cards=[...box.querySelectorAll('.kpg-card')],valid=new Set(cards.map(c=>Number(c.dataset.photo)));k46Selected=new Set([...k46Selected].filter(i=>valid.has(i)));
   let toolbar=box.querySelector('.k46-selection');if(!toolbar){toolbar=document.createElement('div');toolbar.className='k46-selection';const grid=box.querySelector('.kpg-grid');if(grid)grid.before(toolbar)}
   if(toolbar)toolbar.innerHTML=`<button type="button" onclick="kokosK46SelectAll()">SELECCIONAR TODAS</button><button type="button" onclick="kokosK46Clear()">QUITAR SELECCIÓN</button><button type="button" onclick="kokosK46DeleteSelected()" ${k46Selected.size?'':'disabled'}>ELIMINAR SELECCIONADAS (${k46Selected.size})</button>`;
   cards.forEach(card=>{
    const i=Number(card.dataset.photo);card.classList.toggle('k46-chosen',k46Selected.has(i));
    if(!card.querySelector('.k46-check')){const wrap=document.createElement('label');wrap.className='k46-check';wrap.innerHTML=`<input type="checkbox" aria-label="Seleccionar fotografía ${i+1}">`;card.querySelector('.kpg-picture')?.appendChild(wrap);}
    const check=card.querySelector('.k46-check input');if(check){check.checked=k46Selected.has(i);check.onchange=()=>{if(check.checked)k46Selected.add(i);else k46Selected.delete(i);k46DecorateGallery(box)}}
    card.ondragover=e=>{e.preventDefault();const left=e.clientX<card.getBoundingClientRect().left+card.getBoundingClientRect().width/2;card.classList.toggle('k46-before',left);card.classList.toggle('k46-after',!left)};
    card.ondragleave=()=>card.classList.remove('k46-before','k46-after');
    card.ondrop=e=>{e.preventDefault();e.stopPropagation();const from=Number(e.dataTransfer.getData('text/plain'));const to=Number(card.dataset.photo);const left=e.clientX<card.getBoundingClientRect().left+card.getBoundingClientRect().width/2;const a=kokosGalleryUrls();if(!Number.isInteger(from)||from<0||from>=a.length||to<0||to>=a.length)return;const [moved]=a.splice(from,1);let target=to+(left?0:1);if(from<target)target--;a.splice(target,0,moved);document.getElementById('edimages').value=a.join('\n');k46Selected.clear();kokosGalleryRefresh()};
    // En pantallas táctiles, mantener pulsada y soltar a la izquierda/derecha de otra foto.
    card.ontouchstart=e=>{if(e.target.closest('button,input,label'))return;const t=e.touches[0];card.dataset.k46TouchX=String(t.clientX);card.dataset.k46TouchY=String(t.clientY);};
    card.ontouchend=e=>{if(!card.dataset.k46TouchX||e.target.closest('button,input,label'))return;delete card.dataset.k46TouchX;delete card.dataset.k46TouchY;const t=e.changedTouches[0];const target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.kpg-card');if(!target||target===card)return;const from=Number(card.dataset.photo),to=Number(target.dataset.photo),a=kokosGalleryUrls();const rect=target.getBoundingClientRect(),left=t.clientX<rect.left+rect.width/2;if(from<0||from>=a.length||to<0||to>=a.length)return;const [photo]=a.splice(from,1);let index=to+(left?0:1);if(from<index)index--;a.splice(index,0,photo);document.getElementById('edimages').value=a.join('\n');k46Selected.clear();kokosGalleryRefresh()};
    if(window.k49BindPointer)window.k49BindPointer(card);
    // Controles «Antes» y «Después» siguen disponibles como alternativa accesible.
   });
  }finally{box.dataset.k46Busy=''}
 }
 window.kokosK46SelectAll=function(){k46Selected=new Set(kokosGalleryUrls().map((_,i)=>i));k46DecorateGallery(document.getElementById('kokos-photo-organizer'))};
 window.kokosK46Clear=function(){k46Selected.clear();k46DecorateGallery(document.getElementById('kokos-photo-organizer'))};
 window.kokosK46DeleteSelected=function(){if(!k46Selected.size)return;const n=k46Selected.size;if(!confirm('¿Quitar '+n+' fotografía(s) del producto? No se eliminarán físicamente de Supabase.'))return;const a=kokosGalleryUrls().filter((_,i)=>!k46Selected.has(i));document.getElementById('edimages').value=a.join('\n');k46Selected.clear();kokosGalleryRefresh()};
})();
</script>

<script id="kokos-v57-carousel-fix">
(function(){
 // Advance exactly one card per click, including when looped copies exist.
 let lockedUntil=0;
 window.kokosV47Scroll=function(direction){
  const track=document.getElementById('k47-rec-track');if(!track)return;
  const now=Date.now();if(now<lockedUntil)return;
  const cards=[...track.children].filter(n=>n.classList.contains('tile'));
  if(cards.length<2)return;
  const current=track.scrollLeft;
  let next;
  if(direction>0){next=cards.find(n=>n.offsetLeft-track.offsetLeft>current+4)}
  else{next=[...cards].reverse().find(n=>n.offsetLeft-track.offsetLeft<current-4)}

  lockedUntil=now+330;
  track.scrollTo({left:next.offsetLeft-track.offsetLeft,behavior:'smooth'});
 };
 // The iPhone can interpret rapid repeated taps as a double-tap zoom.
 document.addEventListener('click',function(e){
  if(e.target.closest('.gallery-arrow,.k47-rec-controls button'))e.preventDefault();
 },false);
})();
</script>

<script id="kokos-v58-mobile-js">
(function(){
 const follow=document.getElementById('k56-follow');
 const header=document.querySelector('header.top');
 if(follow&&header){
  const row=document.createElement('div');row.id='k58-follow-row';
  header.insertAdjacentElement('afterend',row);row.appendChild(follow);
 }
 // Keep exactly one card of movement per tap, even if the next tap comes during smooth scrolling.
 let lastIndex=null,lastTap=0,lastTrack=null;
 window.kokosV47Scroll=function(direction){
  const track=document.getElementById('k47-rec-track');if(!track)return;
  const cards=[...track.children].filter(n=>n.classList.contains('tile'));
  if(cards.length<2)return;
  const first=cards[0].offsetLeft;
  const positions=cards.map(n=>n.offsetLeft-first);
  const now=Date.now();
  if(track!==lastTrack||lastIndex===null||now-lastTap>650){
   let best=0,dist=Infinity;
   positions.forEach((x,i)=>{const d=Math.abs(x-track.scrollLeft);if(d<dist){dist=d;best=i}});
   lastIndex=best;
  }
  lastTrack=track;lastTap=now;
  lastIndex=Math.max(0,Math.min(cards.length-1,lastIndex+(direction>0?1:-1)));
  track.scrollTo({left:positions[lastIndex],behavior:'smooth'});
 };
 // Prevent rapid tapping the gallery navigation from being treated as a double-tap zoom on iOS.
 // Do not prevent touchend on gallery arrows: iOS then suppresses their click.
 // touch-action:manipulation in CSS prevents double-tap zoom while preserving clicks.
})();

/* V72 — request coalescing: reduce duplicate simultaneous reads without caching stale drafts.
   Deliberately does not cache reads after they finish: saves and publication remain authoritative. */
(function(){
 'use strict';
 const pendingReads=new Map();
 const previousRequest=sbRequest;
 sbRequest=function(path,options={}){
  const method=String(options.method||'GET').toUpperCase();
  if(method!=='GET')return previousRequest(path,options);
  const key=(options.auth?'admin:':'public:')+path;
  if(pendingReads.has(key))return pendingReads.get(key);
  const promise=Promise.resolve().then(()=>previousRequest(path,options));
  pendingReads.set(key,promise);
  promise.finally(()=>{if(pendingReads.get(key)===promise)pendingReads.delete(key)}).catch(()=>{});
  return promise;
 };
 let cloudInFlight=null;
 const previousLoad=loadCloud;
 loadCloud=function(...args){
  if(cloudInFlight)return cloudInFlight;
  const promise=Promise.resolve().then(()=>previousLoad(...args));
  cloudInFlight=promise;
  promise.finally(()=>{if(cloudInFlight===promise)cloudInFlight=null}).catch(()=>{});
  return promise;
 };
})();

<script>
/* V73 — unified read cache, mutation invalidation and authentication transitions.
   No localStorage, no cross-user persistence and no caching of mutation responses.
   Most importantly: saving one item no longer refetches every unchanged table. */
(function(){
 'use strict';
 const cache=new Map();
 const inFlight=new Map();
 const generations=new Map();
 const TTL_ADMIN=15000, TTL_PUBLIC=60000;
 let lastIdentity='';
 function identity(){return isLogged()?'draft:'+String(sbSession?.user?.id||'unknown'):'public'}
 function clearAll(){cache.clear();inFlight.clear();generations.clear()}
 function ensureIdentity(){const next=identity();if(next!==lastIdentity){clearAll();lastIdentity=next}return next}
 function invalidate(table){
  const bare=String(table||'').replace(/^kokos_draft_/,'');
  for(const key of [...new Set([...cache.keys(),...inFlight.keys(),...generations.keys()])]){
   if(!bare||key.includes(':'+bare+'?')){
    generations.set(key,(generations.get(key)||0)+1);
    cache.delete(key);inFlight.delete(key);
   }
  }
 }
 const underlyingTable=sbTable;
 sbTable=function(name,params=''){
  const who=ensureIdentity(),key=who+':'+name+'?'+params,now=Date.now();
  const existing=cache.get(key);
  if(existing&&existing.expires>now)return Promise.resolve(existing.value);
  if(inFlight.has(key))return inFlight.get(key);
  const generation=generations.get(key)||0;
  const promise=Promise.resolve().then(()=>underlyingTable(name,params)).then(value=>{
   if(identity()===who&&(generations.get(key)||0)===generation){
    cache.set(key,{value,expires:Date.now()+(who==='public'?TTL_PUBLIC:TTL_ADMIN)});
   }
   return value;
  }).finally(()=>{if(inFlight.get(key)===promise)inFlight.delete(key)});
  inFlight.set(key,promise);
  return promise;
 };
 const underlyingRequest=sbRequest;
 sbRequest=function(path,options={}){
  ensureIdentity();
  const method=String(options.method||'GET').toUpperCase();
  if(method==='GET')return underlyingRequest(path,options);
  const result=underlyingRequest(path,options);
  // Invalidate only AFTER successful mutations. A failed save keeps the old view.
  return Promise.resolve(result).then(value=>{
   if(/^\/rest\/v1\/rpc\/kokos_publish_draft(?:\?|$)/.test(path))invalidate('');
   else {
    const match=path.match(/^\/rest\/v1\/([a-z_]+)(?:\?|$)/);
    if(match)invalidate(match[1]);
   }

  });

})();
</script>

<script>
/* V75: Preserve public listing DOM during client-side navigation.
   This prevents repeated image element creation and unnecessary image revalidation
   when returning to Inicio / Stock / Bajo pedido / catalog listing.
   No caching of admin, product details or private drafts. */
(function(){
 'use strict';
 const snapshots=new Map();
 const LIMIT=5;
 const route=()=>decodeURIComponent(location.hash.slice(1)||'home');

 let active=route(),lastNavigation=0;
 const previousRender=render;
 function forget(){snapshots.clear()}
 function saveSnapshot(r){
  if(!eligible(r)||!document.getElementById('app'))return;
  const app=document.getElementById('app');
  const fragment=document.createDocumentFragment();
  while(app.firstChild)fragment.appendChild(app.firstChild);
  snapshots.delete(r);snapshots.set(r,fragment);
  if(snapshots.size>LIMIT)snapshots.delete(snapshots.keys().next().value);
 }
 render=function(...args){
  const next=route(),changed=next!==active;
  if(changed){
   saveSnapshot(active);
   active=next;
   lastNavigation=Date.now();
   if(eligible(next)&&snapshots.has(next)){
    const app=document.getElementById('app');
    const fragment=snapshots.get(next);snapshots.delete(next);
    app.replaceChildren(fragment);

    if(typeof applyMobileCoverSources==='function')applyMobileCoverSources();

 };

<script>
/* V92: Restore the top of every public page after SPA navigation.
   Safari can preserve the old scroll position when hash routes swap content,
   especially when the destination page is shorter or a cached DOM is restored. */
(function(){
  'use strict';
  if ('scrollRestoration' in history) history.scrollRestoration='manual';
  const publicRoute = route => /^(home|stock|order|catalog\/|product\/|order-detail\/)/.test(route);
  function topOfPage(){
    window.scrollTo({top:0,left:0,behavior:'instant'});
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
  }
  function afterNavigation(){
    topOfPage();
    requestAnimationFrame(()=>{
      topOfPage();
      requestAnimationFrame(topOfPage);
    });
  }
  if(typeof window.go==='function'){
    const originalGo=window.go;
    window.go=function(route){
      const result=originalGo.apply(this,arguments);
      if(publicRoute(String(route)))afterNavigation();
      return result;
    };
  }
  window.addEventListener('hashchange',()=>{
    const route=decodeURIComponent(location.hash.slice(1)||'home');
    if(publicRoute(route))afterNavigation();
  });
  document.addEventListener('click',event=>{
    const a=event.target.closest('a[href^="#"]');
    if(!a)return;
    const route=decodeURIComponent(a.getAttribute('href').slice(1));
    if(publicRoute(route))afterNavigation();
  },true);
})();
</script>

<script id="kokos-v94-ios-marquee-resume-js">
(function(){
  let pending=false;
  function restartFollowTicker(){
    if(pending)return;
    pending=true;
    requestAnimationFrame(function(){
      const ticker=document.querySelector('#k58-follow-row .k60-marquee');
      if(!ticker){pending=false;return;}
      // iOS Safari may restore a frozen compositor animation from its back-forward cache.
      ticker.style.setProperty('-webkit-animation','none','important');
      ticker.style.setProperty('animation','none','important');
      void ticker.offsetWidth;
      requestAnimationFrame(function(){
        ticker.style.removeProperty('-webkit-animation');
        ticker.style.removeProperty('animation');
        pending=false;
      });
    });
  }
  window.addEventListener('pageshow',function(e){if(e.persisted)restartFollowTicker();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)restartFollowTicker();});
  window.addEventListener('popstate',restartFollowTicker);
})();

.kokos-static-promo-banner{position:sticky;top:var(--kokos-header-height,76px);z-index:999;width:100%;box-sizing:border-box;background:#ffc400;color:#061c38;text-align:center;padding:15px 22px;font-size:clamp(13px,1.65vw,23px);font-weight:950;line-height:1.35;letter-spacing:.015em;overflow-wrap:anywhere}
.kokos-static-promo-banner span{display:inline-block;max-width:1100px}
@media(max-width:700px){.kokos-static-promo-banner{padding:12px 15px;font-size:14px}}
</style>
<script id="kokos-v103-promo-fix">
(function(){
 const oldCampaignAdmin=window.campaignAdmin;
 window.campaignAdmin=function(){
  let html=oldCampaignAdmin();
  const c=window.kokosCampaignState?.()||{};
  const field='<div class="field"><label for="campaign_banner_text">TEXTO DE LA FRANJA AMARILLA · STOCK, PLAYER Y RETRO/FAN</label><input id="campaign_banner_text" maxlength="200" type="text" value="'+esc(c.bannerText||'PROMOCIÓN ESPECIAL · 2 CAMISETAS POR $75')+'"><p class="small">Estática, sin botones ni enlaces. Visible únicamente cuando la campaña está activada.</p></div>';
  const anchor=' ACTIVAR CAMPAÑA DE PROMOCIONES</label>';
  const idx=html.indexOf(anchor);
  if(idx>=0)html=html.slice(0,idx+anchor.length)+field+html.slice(idx+anchor.length);
  return html;
 };
 // Override at the end, after every legacy administrator wrapper.
 const previousAdmin=admin;
 admin=function(){
  if(adminTab!=='campaign')return previousAdmin();
  const tab=adminTab;adminTab='products';
  let html;
  try{html=previousAdmin();}finally{adminTab=tab;}
  if(!isLogged())return html;
  const holder=document.createElement('div');holder.innerHTML=html;
  const layout=holder.querySelector('.admin-layout');if(!layout)return html;
  const pane=layout.children[1];if(pane)pane.innerHTML=window.campaignAdmin();
  const nav=layout.querySelector('.admin-nav');
  if(nav){
   let promo=[...nav.querySelectorAll('button')].find(b=>b.textContent.trim()==='PROMOCIONES');
   if(!promo){promo=document.createElement('button');promo.type='button';promo.textContent='PROMOCIONES';promo.setAttribute('onclick',"adminTab='campaign';editing=null;render(false)");nav.insertBefore(promo,nav.lastElementChild);}
   nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===promo));
  }
  return holder.innerHTML;
 };
 const oldRender=render;
 render=function(...args){
  document.querySelectorAll(".kokos-static-promo-banner").forEach(el=>el.remove());
  oldRender(...args);
  document.querySelectorAll(".kokos-static-promo-banner").forEach(el=>el.remove());
  const route=decodeURIComponent(location.hash.slice(1)||'home');
  const c=window.kokosCampaignState?.();
  if(!c?.enabled)return;
  const eligible=route==='stock'||/^catalog\/(player|retro|fan)(\/|$)/i.test(route)||route.startsWith('product/');
  if(!eligible)return;
  if(route.startsWith('product/')){
   const id=route.split('/')[1];const product=(data.products||[]).find(p=>String(p.id)===id);
   if(!product||!['player','retro','fan'].includes(String(product.version||'').toLowerCase()))return;
  }
  const app=document.getElementById('app');if(!app)return;
  const banner=document.createElement('div');banner.className='kokos-static-promo-banner';banner.setAttribute('role','note');
  const content=document.createElement('span');content.textContent=c.bannerText||'PROMOCIÓN ESPECIAL · 2 CAMISETAS POR $75';banner.appendChild(content);
  const header=app.querySelector('header');
  if(header){document.documentElement.style.setProperty('--kokos-header-height',Math.ceil(header.getBoundingClientRect().height)+'px');header.insertAdjacentElement('afterend',banner);}else app.insertBefore(banner,app.firstChild);
 };
})();
</script>
</body></html>
