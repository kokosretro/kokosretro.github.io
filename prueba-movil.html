async function kokosUploadPhotos(fileInputId,targetId){
 if(!isLogged())return alert('Primero inicia sesión como administrador.');
 const fileInput=$(fileInputId),target=$(targetId),files=[...(fileInput?.files||[])];
 if(!target||!files.length)return alert('Selecciona al menos una fotografía.');
 const allowed=['image/jpeg','image/png','image/webp','image/avif'];
 if(files.some(f=>!allowed.includes(f.type)||f.size>8*1024*1024))return alert('Usa JPG, PNG, WebP o AVIF de hasta 8 MB por fotografía.');
 const btn=fileInput.nextElementSibling;
 if(btn)btn.disabled=true;
 try{
  const urls=[];
  for(const file of files){
   const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'})[file.type];
   const path='catalogo/'+crypto.randomUUID()+'.'+ext;
   const response=await fetch(SB_URL+'/storage/v1/object/kokos-images/'+path,{
    method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+sbSession.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file
   });
   if(!response.ok)throw Error('No se pudo subir '+file.name+' ('+response.status+'): '+(await response.text()).slice(0,180));
   urls.push(SB_URL+'/storage/v1/object/public/kokos-images/'+path);
  }
  target.value=targetId==='edimages'?[target.value.trim(),...urls].filter(Boolean).join('\n'):urls[0];
  alert(urls.length+' imagen(es) subida(s). Ahora pulsa GUARDAR para aplicar los cambios.');
 }catch(error){alert(error.message)}finally{if(btn)btn.disabled=false;}
}

let variosSelectedSize='';

const variosOldWhatsapp=whatsapp;

const variosSaveBeforeV12=saveEdit;
saveEdit=async function(){
 if(adminTab!=='products'||$('edversion')?.value!=='varios')return variosSaveBeforeV12();

 const old=data.products.find(x=>x.id===editing),name=$('edname')?.value.trim();if(!name)return alert('Escribe el nombre.');
 const custom=$('variosCustomMode')?.checked;
 let variants=custom?variosDraft.map(v=>({label:String(v.label||'').trim(),quantity:Number(v.quantity)})):[];
 if(custom){if(!variants.length)return alert('Agrega al menos una variante o selecciona Sin tallas.');if(variants.some(v=>!v.label||!Number.isInteger(v.quantity)||v.quantity<0))return alert('Completa cada variante con nombre y cantidad entera mayor o igual a cero.');if(new Set(variants.map(v=>v.label.toLowerCase())).size!==variants.length)return alert('No repitas el nombre de una variante.');}
 const price=$('edprice').value===''?0:Number($('edprice').value),description=$('eddesc').value,images=$('edimages').value.split('\n').map(x=>x.trim()).filter(Boolean),id=old?.id||crypto.randomUUID();
 const slug=(name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item')+'-'+id.slice(0,8);
 try{
  await sbWrite('products',{id,name,slug:old?.slug||slug,description,price,product_type:'varios',cover_image_url:images[0]||null,published:old?.visible??true});
  await sbRequest('/rest/v1/product_images?product_id=eq.'+id,{method:'DELETE',auth:true});
  if(images.length)await sbWrite('product_images',images.map((url,i)=>({product_id:id,image_url:url,sort_order:i})));
  // Fila técnica para compatibilidad con el esquema actual. Las variantes reales van en JSONB.
  await sbRequest('/rest/v1/product_inventory?product_id=eq.'+id,{method:'DELETE',auth:true});
  await sbWrite('product_inventory',[{product_id:id,size:'M',quantity:1}]);
  const rows=await sbTable('site_settings');const st=rows[0];if(!st?.id)throw Error('No se encontró la configuración del sitio.');
  const content={...(st.content||{})};content.variosVariants={...(content.variosVariants||{}),[id]:variants};
  await sbWrite('site_settings',{content},'PATCH','id=eq.'+encodeURIComponent(st.id));
  editing=null;await loadCloud();alert('Producto y variantes guardados en Supabase.');
 }catch(e){alert('No se pudo guardar: '+e.message)}
};
